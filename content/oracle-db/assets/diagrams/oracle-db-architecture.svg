<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Oracle Database Architecture</title><desc>Tiered architecture: Instance (memory) / Database (storage)</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Oracle Database Architecture</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Instance (memory) vs database (files) — the core distinction.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="36" y="107.0" width="728" height="149.5" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="177.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Instance (memory)</text><text x="52" y="195.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 1</text><rect x="200.0" y="153.8" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="289.3" y="177.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">SGA — shared memory</text><rect x="390.7" y="153.8" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="480.0" y="177.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">PGA — per-process</text><rect x="581.3" y="153.8" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="670.7" y="177.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Background processes</text><line x1="400" y1="256.5" x2="400" y2="278.5" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="36" y="278.5" width="728" height="149.5" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="349.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Database (storage)</text><text x="52" y="367.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 2</text><rect x="200.0" y="325.2" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="289.3" y="349.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Datafiles</text><rect x="390.7" y="325.2" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="480.0" y="349.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Control files</text><rect x="581.3" y="325.2" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="670.7" y="349.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Redo log files</text></svg>