<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>GDB Essentials</title><desc>Command reference: gdb ./a.out, break main, run [args], next / step, print var, backtrace</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">GDB Essentials</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Debug compiled C with confidence.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">gdb ./a.out</text><text x="50" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Start debugging the binary</text><rect x="408" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">break main</text><text x="422" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Breakpoint at main()</text><rect x="36" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">run [args]</text><text x="50" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Start the program</text><rect x="408" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">next / step</text><text x="422" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Step over / into</text><rect x="36" y="259.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="283.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">print var</text><text x="50" y="303.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Inspect a variable</text><rect x="408" y="259.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="283.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">backtrace</text><text x="422" y="303.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Show the call stack</text><rect x="36" y="335.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="359.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">continue / quit</text><text x="50" y="379.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Resume / exit gdb</text></svg>