<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>AWS Compute Options</title><desc>Table comparing Service across Model, Best for</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">AWS Compute Options</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Pick by control needs and operational appetite.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36.0" y="113.0" width="236.7" height="44" rx="6" fill="#16202f"/><text x="48.0" y="141.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14" font-weight="700" fill="#3ddc97">Service</text><rect x="278.7" y="113.0" width="236.7" height="44" rx="6" fill="#16202f"/><text x="290.7" y="141.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14" font-weight="700" fill="#3ddc97">Model</text><rect x="521.3" y="113.0" width="236.7" height="44" rx="6" fill="#16202f"/><text x="533.3" y="141.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14" font-weight="700" fill="#3ddc97">Best for</text><rect x="36.0" y="163.0" width="236.7" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="183.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">EC2</text><rect x="278.7" y="163.0" width="236.7" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="290.7" y="183.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Virtual machines</text><rect x="521.3" y="163.0" width="236.7" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="533.3" y="183.0" font-family='-apple