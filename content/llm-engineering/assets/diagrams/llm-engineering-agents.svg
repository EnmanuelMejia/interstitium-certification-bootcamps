<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Agent Loop</title><desc>Continuous loop: Perceive -&gt; Reason -&gt; Act -&gt; Observe</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Agent Loop</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Perceive → reason → act → observe, until done.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="316.0" y="128.5" width="168" height="64" rx="10" fill="#101722" stroke="#3ddc97" stroke-width="1.5"/><text x="400.0" y="156.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Perceive</text><text x="400.0" y="176.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8" text-anchor="middle">Read state + user goal</text><rect x="434.0" y="246.5" width="168" height="64" rx="10" fill="#101722" stroke="#3ddc97" stroke-width="1.5"/><text x="518.0" y="274.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Reason</text><text x="518.0" y="294.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8" text-anchor="middle">LLM plans the next</text><rect x="316.0" y="364.5" width="168" height="64" rx="10" fill="#101722" stroke="#3ddc97" stroke-width="1.5"/><text x="400.0" y="392.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Act</text><text x="400.0" y="412.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8" text-anchor="middle">Call a tool / API</text><rect x="198.0" y="246.5" width="168" height="64" rx="10" fill="#101722" stroke="#3ddc97" stroke-width="1.5"/><text x="282.0" y="274.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Observe</text><text x="282.0" y="294.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8" text-anchor="middle">Read the result</text><path d="M400.0,160.5 Q483.0,195.5 518.0,278.5" fill="none" stroke="#3ddc97" stroke-width="2" marker-end="url(#ah)"/><path d="M518.0,278.5 Q483.0,361.5 400.0,396.5" fill="none" stroke="#3ddc97" stroke-width="2" marker-end="url(#ah)"/><path d="M400.0,396.5 Q317.0,361.5 282.0,278.5" fill="none" stroke="#3ddc97" stroke-width="2" marker-end="url(#ah)"/><path d="M282.0,278.5 Q317.0,195.5 400.0,160.5" fill="none" stroke="#3ddc97" stroke-width="2" marker-end="url(#ah)"/><circle cx="400" cy="278" r="34" fill="#16202f" stroke="#223046" stroke-width="1.5"/><text x="400" y="282" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="700" fill="#93a4b8" text-anchor="middle">repeats</text></svg>