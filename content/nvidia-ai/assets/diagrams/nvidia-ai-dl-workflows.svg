<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Deep Learning Workflow</title><desc>Sequence: Prepare -&gt; Train -&gt; Validate -&gt; Test -&gt; Deploy -&gt; Monitor</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Deep Learning Workflow</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Data to deployed model on GPUs.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="36.0" y="137.0" width="88.0" height="190" rx="10" fill="#16202f" stroke="#223046" stroke-width="1.5"/><circle cx="80" cy="135" r="14" fill="#3ddc97"/><text x="80" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="80.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Prepare</text><text x="80.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Collect,</text><text x="80.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">clean, split</text><text x="80.0" y="230.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">data</text><line x1="138.0" y1="232.0" x2="164.0" y2="232.0" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><rect x="164.0" y="137.0" width="88.0" height="190" rx="10" fill="#101722" stroke="#223046" stroke-width="1.5"/><circle cx="208" cy="135" r="14" fill="#3ddc97"/><text x="208" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="208.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Train</text><text x="208.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Fit model on</text><text x="208.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">training set</text><line x1="266.0" y1="232.0" x2="292.0" y2="232.0" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><rect x="292.0" y="137.0" width="88.0" height="190" rx="10" fill="#101722" stroke="#223046" stroke-width="1.5"/><circle cx="336" cy="135" r="14" fill="#3ddc97"/><text x="336" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="336.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Validate</text><text x="336.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Tune on</text><text x="336.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">validation</text><text x="336.0" y="230.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">set</text><line x1="394.0" y1="232.0" x2="420.0" y2="232.0" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><rect x="420.0" y="137.0" width="88.0" height="190" rx="10" fill="#101722" stroke="#223046" stroke-width="1.5"/><circle cx="464" cy="135" r="14" fill="#3ddc97"/><text x="464" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="464.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Test</text><text x="464.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Final score</text><text x="464.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">on held-out</text><text x="464.0" y="230.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">data</text><line x1="522.0" y1="232.0" x2="548.0" y2="232.0" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548.0" y="137.0" width="88.0" height="190" rx="10" fill="#101722" stroke="#223046" stroke-width="1.5"/><circle cx="592" cy="135" r="14" fill="#3ddc97"/><text x="592" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">5</text><text x="592.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Deploy</text><text x="592.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Serve behind</text><text x="592.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">an API</text><line x1="650.0" y1="232.0" x2="676.0" y2="232.0" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><rect x="676.0" y="137.0" width="88.0" height="190" rx="10" fill="#16202f" stroke="#3ddc97" stroke-width="1.5"/><circle cx="720" cy="135" r="14" fill="#fbbf24"/><text x="720" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">6</text><text x="720.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Monitor</text><text x="720.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Drift,</text><text x="720.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">quality,</text><text x="720.0" y="230.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">retrain</text></svg>