<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>IaC &amp; Config Commands</title><desc>Command reference: aws cloudformation deploy --template-file t.yaml --stack-name s, aws cloudformation describe-stacks, aws ssm send-command --instance-ids i-1 --document-name AWS-RunShellScript, aws ssm get-parameter --name /app/db, sam build &amp;&amp; sam deploy</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">IaC &amp; Config Commands</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">CloudFormation and Systems Manager are the DOP workhorses.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">aws cloudformation deploy</text><text x="50" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Deploy a stack from a template</text><rect x="408" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">aws cloudformation describe-stacks</text><text x="422" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Inspect stack status</text><rect x="36" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">aws ssm send-command --instance-ids i-1</text><text x="50" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Run commands fleet-wide</text><rect x="408" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">aws ssm get-parameter --name /app/db</text><text x="422" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Read Parameter Store</text><rect x="36" y="259.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="283.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">sam build &amp;&amp; sam deploy</text><text x="50" y="303.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Build + deploy serverless apps</text></svg>