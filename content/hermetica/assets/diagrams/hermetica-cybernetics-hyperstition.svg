<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Cybernetic Feedback Loop</title><desc>Continuous loop: Sense -&gt; Compare -&gt; Act</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Cybernetic Feedback Loop</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Steering through circular causality.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="316.0" y="128.5" width="168" height="64" rx="10" fill="#101722" stroke="#3ddc97" stroke-width="1.5"/><text x="400.0" y="156.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Sense</text><text x="400.0" y="176.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8" text-anchor="middle">Measure the output</text><rect x="418.2" y="305.5" width="168" height="64" rx="10" fill="#101722" stroke="#3ddc97" stroke-width="1.5"/><text x="502.2" y="333.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Compare</text><text x="502.2" y="353.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8" text-anchor="middle">Against the goal</text><rect x="213.8" y="305.5" width="168" height="64" rx="10" fill="#101722" stroke="#3ddc97" stroke-width="1.5"/><text x="297.8" y="333.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Act</text><text x="297.8" y="353.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8" text-anchor="middle">Correct the input</text><path d="M400.0,160.5 Q480.5,232.0 502.2,337.5" fill="none" stroke="#3ddc97" stroke-width="2" marker-end="url(#ah)"/><path d="M502.2,337.5 Q400.0,371.5 297.8,337.5" fill="none" stroke="#3ddc97" stroke-width="2" marker-end="url(#ah)"/><path d="M297.8,337.5 Q319.5,232.0 400.0,160.5" fill="none" stroke="#3ddc97" stroke-width="2" marker-end="url(#ah)"/><circle cx="400" cy="278" r="34" fill="#16202f" stroke="#223046" stroke-width="1.5"/><text x="400" y="282" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="700" fill="#93a4b8" text-anchor="middle">repeats</text></svg>