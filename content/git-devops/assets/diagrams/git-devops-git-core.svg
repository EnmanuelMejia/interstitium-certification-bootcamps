<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Git Core Commands</title><desc>Command reference: git init, git clone &lt;url&gt;, git status, git add ., git commit -m &quot;msg&quot;, git branch</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Git Core Commands</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">The ten commands behind 95% of Git work.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107.0" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git init</text><text x="50" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Create a new repository</text><rect x="408" y="107.0" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git clone &lt;url&gt;</text><text x="422" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Copy a remote repo locally</text><rect x="36" y="172.4" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="196.4" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git status</text><text x="50" y="216.4" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Show working-tree state</text><rect x="408" y="172.4" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="196.4" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git add .</text><text x="422" y="216.4" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Stage changes</text><rect x="36" y="237.8" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="261.8" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git commit -m &quot;msg&quot;</text><text x="50" y="281.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Snapshot staged changes</text><rect x="408" y="237.8" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="261.8" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git branch</text><text x="422" y="281.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">List / create branches</text><rect x="36" y="303.2" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="327.2" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git checkout -b &lt;name&gt;</text><text x="50" y="347.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Create + switch branch</text><rect x="408" y="303.2" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="327.2" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git merge &lt;branch&gt;</text><text x="422" y="347.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Join branch into current</text><rect x="36" y="368.6" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="392.6" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git push</text><text x="50" y="412.6" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Upload commits to remote</text><rect x="408" y="368.6" width="356" height="55.4" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="392.6" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">git pull</text><text x="422" y="412.6" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Fetch + merge from remote</text></svg>