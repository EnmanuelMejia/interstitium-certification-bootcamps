<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Forensic Challenge Approach</title><desc>Sequence: Registers / cache -&gt; RAM -&gt; Network state -&gt; Running processes -&gt; Disk</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Forensic Challenge Approach</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Methodical beats clever.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="36.0" y="137.0" width="113.6" height="190" rx="10" fill="#16202f" stroke="#223046" stroke-width="1.5"/><circle cx="92" cy="135" r="14" fill="#3ddc97"/><text x="92" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="92.8" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Registers /</text><text x="92.8" y="196.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">cache</text><text x="92.8" y="219.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Most volatile —</text><text x="92.8" y="234.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5