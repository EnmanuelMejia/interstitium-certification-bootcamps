<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Classification Metrics</title><desc>Table comparing Metric across What it measures</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Classification Metrics</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Accuracy alone lies on imbalanced data.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36.0" y="113.0" width="358.0" height="44" rx="6" fill="#16202f"/><text x="48.0" y="141.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14" font-weight="700" fill="#3ddc97">Metric</text><rect x="400.0" y="113.0" width="358.0" height="44" rx="6" fill="#16202f"/><text x="412.0" y="141.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14" font-weight="700" fill="#3ddc97">What it measures</text><rect x="36.0" y="163.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="183.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">Accuracy</text><rect x="400.0" y="163.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="183.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Overall correct predictions</text><rect x="36.0" y="208.0" width="358.0" height="40" rx="6" fill="#0a0e14" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="228.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">Precision</text><rect x="400.0" y="208.0" width="358.0" height="40" rx="6" fill="#0a0e14" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="228.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">True positives ÷ predicted positive</text><rect x="36.0" y="253.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="273.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">Recall</text><rect x="400.0" y="253.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="273.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">True positives ÷ actual positive</text><rect x="36.0" y="298.0" width="358.0" height="40" rx="6" fill="#0a0e14" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="318.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">F1</text><rect x="400.0" y="298.0" width="358.0" height="40" rx="6" fill="#0a0e14" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="318.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Harmonic mean of precision/recall</text><rect x="36.0" y="343.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="363.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">ROC-AUC</text><rect x="400.0" y="343.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="363.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Ranking quality across thresholds</text></svg>