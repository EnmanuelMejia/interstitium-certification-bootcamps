<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>SELECT Essentials</title><desc>Command reference: SELECT col1, col2 FROM employees, SELECT * FROM t WHERE hire_date &gt; DATE '2020-01-01', SELECT DISTINCT dept FROM emp, SELECT … ORDER BY salary DESC, SELECT … FETCH FIRST 10 ROWS ONLY, SELECT COUNT(*) FROM t</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">SELECT Essentials</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">The core query building blocks.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">SELECT col1, col2 FROM employees</text><text x="50" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Pick columns from a table</text><rect x="408" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">SELECT * FROM t WHERE hire_date &gt; DATE</text><text x="422" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Filter rows</text><rect x="36" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">SELECT DISTINCT dept FROM emp</text><text x="50" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Unique values only</text><rect x="408" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">SELECT … ORDER BY salary DESC</text><text x="422" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Sort results</text><rect x="36" y="259.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="283.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">SELECT … FETCH FIRST 10 ROWS ONLY</text><text x="50" y="303.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Top-N rows (12c+)</text><rect x="408" y="259.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="283.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">SELECT COUNT(*) FROM t</text><text x="422" y="303.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Row count</text></svg>