<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Smart Pointers &amp; RAII</title><desc>Key ideas: unique_ptr; shared_ptr; weak_ptr; RAII</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Smart Pointers &amp; RAII</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Ownership expressed in types — leaks become compile-time thinking.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="119" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="133" r="13" fill="#3ddc97"/><text x="66" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="86" y="137" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">unique_ptr</text><text x="86" y="157" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Exclusive ownership, zero overhead.</text><rect x="408" y="107" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="119" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="133" r="13" fill="#3ddc97"/><text x="438" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="458" y="137" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">shared_ptr</text><text x="458" y="157" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Reference-counted sharing.</text><rect x="36" y="237" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="249" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="263" r="13" fill="#3ddc97"/><text x="66" y="268" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="86" y="267" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">weak_ptr</text><text x="86" y="287" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Non-owning observer, breaks cycles.</text><rect x="408" y="237" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="249" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="263" r="13" fill="#3ddc97"/><text x="438" y="268" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="458" y="267" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">RAII</text><text x="458" y="287" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Resources tied to object lifetime.</text></svg>