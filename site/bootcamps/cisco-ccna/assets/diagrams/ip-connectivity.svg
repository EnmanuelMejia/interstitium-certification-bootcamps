  <text x="28" y="34" font-family="sans-serif" font-size="19" font-weight="700" fill="#f2f6fc">IP connectivity: routing between networks</text>  <text x="28" y="54" font-family="sans-serif" font-size="11" fill="#7f93b3" letter-spacing="2">CISCO CCNA</text>  <line x1="122" y1="228" x2="174" y2="228" stroke="#7d8fb0" stroke-width="1.8" marker-end="url(#arr)"/>  <text x="148" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8fa3c4">192.168.1.0/24</text>  <line x1="278" y1="228" x2="334" y2="228" stroke="#7d8fb0" stroke-width="1.8" marker-end="url(#arr)"/>  <text x="306" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8fa3c4">10.0.0.0/30</text>  <line x1="438" y1="228" x2="490" y2="228" stroke="#7d8fb0" stroke-width="1.8" marker-end="url(#arr)"/>  <text x="464" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8fa3c4">172.16.0.0/24</text>  <rect x="24" y="200" width="96" height="56" rx="10" fill="#141d33" stroke="#1ba0d7" stroke-width="2"/>  <text x="72" y="223" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#eef3fa">PC</text>  <text x="72" y="241" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9fb0c8">192.168.1.10</text>  <circle cx="228" cy="228" r="48" fill="#141d33" stroke="#1ba0d7" stroke-width="2"/>  <text x="228" y="223" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eef3fa">R1</text>  <text x="228" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9fb0c8">routing table</text>  <circle cx="388" cy="228" r="48" fill="#141d33" stroke="#1ba0d7" stroke-width="2"/>  <text x="388" y="223" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eef3fa">R2</text>  <text x="388" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9fb0c8">routing table</text>  <rect x="496" y="200" width="88" height="56" rx="10" fi