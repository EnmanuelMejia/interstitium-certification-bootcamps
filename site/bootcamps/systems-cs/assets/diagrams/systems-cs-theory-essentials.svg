<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Theory Essentials</title><desc>Key ideas: P vs NP; Turing machines; Automata; Halting problem</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Theory Essentials</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">The ideas behind the practice.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="119" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="133" r="13" fill="#3ddc97"/><text x="66" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="86" y="137" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">P vs NP</text><text x="86" y="157" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Verify fast vs solve fast.</text><rect x="408" y="107" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="119" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="133" r="13" fill="#3ddc97"/><text x="438" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="458" y="137" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Turing machines</text><text x="458" y="157" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">The model of computation.</text><rect x="36" y="237" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="249" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="263" r="13" fill="#3ddc97"/><text x="66" y="268" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="86" y="267" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Automata</text><text x="86" y="287" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Regex = regular languages.</text><rect x="408" y="237" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="249" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="263" r="13" fill="#3ddc97"/><text x="438" y="268" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="458" y="267" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Halting problem</text><text x="458" y="287" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Some questions are undecidable.</text></svg>