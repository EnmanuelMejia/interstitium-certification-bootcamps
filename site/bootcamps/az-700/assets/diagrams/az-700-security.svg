<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Network Security Layers</title><desc>Stacked layers, top to bottom: Edge &gt; Subnet &gt; Host &gt; Monitor</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Network Security Layers</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Filter at the edge, the subnet, and the host.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="100" y="107.0" width="600" height="52.0" rx="9" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="100" y="107.0" width="600" height="52.0" rx="9" fill="#3ddc97" opacity="0.06"/><circle cx="130" cy="133" r="14" fill="#3ddc97"/><text x="130" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="154" y="129.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Edge</text><text x="154" y="147.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12" fill="#93a4b8">Azure Firewall, DDoS Protection</text><line x1="400" y1="159.0" x2="400" y2="167.0" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="100" y="167.0" width="600" height="52.0" rx="9" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="100" y="167.0" width="600" height="52.0" rx="9" fill="#3ddc97" opacity="0.07"/><circle cx="130" cy="193" r="14" fill="#3ddc97"/><text x="130" y="198" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="154" y="189.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Subnet</text><text x="154" y="207.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12" fill="#93a4b8">NSGs — allow/deny rules</text><line x1="400" y1="219.0" x2="400" y2="227.0" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="100" y="227.0" width="600" height="52.0" rx="9" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="100" y="227.0" width="600" height="52.0" rx="9" fill="#3ddc97" opacity="0.08"/><circle cx="130" cy="253" r="14" fill="#3ddc97"/><text x="130" y="258" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="154" y="249.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Host</text><text x="154" y="267.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12" fill="#93a4b8">App Gateway WAF, JIT access</text><line x1="400" y1="279.0" x2="400" y2="287.0" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="100" y="287.0" width="600" height="52.0" rx="9" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="100" y="287.0" width="600" height="52.0" rx="9" fill="#3ddc97" opacity="0.09"/><circle cx="130" cy="313" r="14" fill="#3ddc97"/><text x="130" y="318" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="154" y="309.0" font-family='-apple-system,Segoe UI,Roboto,Helvetic