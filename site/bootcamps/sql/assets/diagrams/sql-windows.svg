<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Window Functions</title><desc>Command reference: ROW_NUMBER() OVER (ORDER BY salary DESC), RANK() / DENSE_RANK(), LAG(salary) OVER (PARTITION BY dept), SUM(sales) OVER (PARTITION BY region)</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Window Functions</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Compute across rows without collapsing them.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">ROW_NUMBER() OVER (ORDER BY salary DESC)</text><text x="50" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Rank rows 1..n</text><rect x="408" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">RANK() / DENSE_RANK()</text><text x="422" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Rank with/without gaps</text><rect x="36" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">LAG(salary) OVER (PARTITION BY dept)</text><text x="50" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Previous row value</text><rect x="408" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">SUM(sales) OVER (PARTITION BY region)</text><text x="422" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Running group totals</text></svg>