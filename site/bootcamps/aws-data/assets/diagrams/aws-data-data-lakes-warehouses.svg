<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Lake → Warehouse on AWS</title><desc>Tiered architecture: Lake (S3) / Catalog + ETL / Serve</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Lake → Warehouse on AWS</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Raw data lands cheap in S3; curated marts serve analytics.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="36" y="107.0" width="728" height="92.3" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="149.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Lake (S3)</text><text x="52" y="167.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 1</text><rect x="274.0" y="125.2" width="200.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="374.0" y="149.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Raw zone</text><rect x="486.0" y="125.2" width="200.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="586.0" y="149.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Curated zone</text><line x1="400" y1="199.3" x2="400" y2="221.3" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="36" y="221.3" width="728" height="92.3" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="263.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Catalog + ETL</text><text x="52" y="281.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 2</text><rect x="274.0" y="239.5" width="200.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="374.0" y="263.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Glue catalog</text><rect x="486.0" y="239.5" width="200.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="586.0" y="263.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Glue jobs</text><line x1="400" y1="313.7" x2="400" y2="335.7" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="36" y="335.7" width="728" height="92.3" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="377.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Serve</text><text x="52" y="395.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 3</text><rect x="274.0" y="353.8" width="200.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="374.0" y="377.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Athena (serverless SQL)</text><rect x="486.0" y="353.8" width="200.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="586.0" y="377.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Redshift (warehouse)</text></svg>