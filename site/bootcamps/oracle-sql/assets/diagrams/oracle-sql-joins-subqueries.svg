<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>JOIN Types</title><desc>Table comparing Join across Keeps</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">JOIN Types</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">How tables combine — and what survives.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36.0" y="113.0" width="358.0" height="44" rx="6" fill="#16202f"/><text x="48.0" y="141.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14" font-weight="700" fill="#3ddc97">Join</text><rect x="400.0" y="113.0" width="358.0" height="44" rx="6" fill="#16202f"/><text x="412.0" y="141.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14" font-weight="700" fill="#3ddc97">Keeps</text><rect x="36.0" y="163.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="183.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">INNER</text><rect x="400.0" y="163.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="183.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Only matching rows</text><rect x="36.0" y="208.0" width="358.0" height="40" rx="6" fill="#0a0e14" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="228.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">LEFT</text><rect x="400.0" y="208.0" width="358.0" height="40" rx="6" fill="#0a0e14" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="228.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">All left rows + matches</text><rect x="36.0" y="253.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="273.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">RIGHT</text><rect x="400.0" y="253.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="273.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">All right rows + matches</text><rect x="36.0" y="298.0" width="358.0" height="40" rx="6" fill="#0a0e14" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="318.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">FULL OUTER</text><rect x="400.0" y="298.0" width="358.0" height="40" rx="6" fill="#0a0e14" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="318.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">All rows, both sides</text><rect x="36.0" y="343.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="48.0" y="363.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#e9f1f4">CROSS</text><rect x="400.0" y="343.0" width="358.0" height="40" rx="6" fill="#101722" stroke="#223046" stroke-width="0.7"/><text x="412.0" y="363.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Cartesian product</text></svg>