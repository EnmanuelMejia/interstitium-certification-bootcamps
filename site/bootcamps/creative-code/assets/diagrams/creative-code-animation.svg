<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Animation Loop</title><desc>Sequence: Setup -&gt; Update -&gt; Draw -&gt; Loop</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Animation Loop</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">The requestAnimationFrame heartbeat.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="36.0" y="137.0" width="152.0" height="190" rx="10" fill="#16202f" stroke="#223046" stroke-width="1.5"/><circle cx="112" cy="135" r="14" fill="#3ddc97"/><text x="112" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="112.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Setup</text><text x="112.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Size canvas, init</text><text x="112.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">state</text><line x1="202.0" y1="232.0" x2="228.0" y2="232.0" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><rect x="228.0" y="137.0" width="152.0" height="190" rx="10" fill="#101722" stroke="#223046" stroke-width="1.5"/><circle cx="304" cy="135" r="14" fill="#3ddc97"/><text x="304" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="304.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Update</text><text x="304.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Advance</text><text x="304.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">positions/time</text><line x1="394.0" y1="232.0" x2="420.0" y2="232.0" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><rect x="420.0" y="137.0" width="152.0" height="190" rx="10" fill="#101722" stroke="#223046" stroke-width="1.5"/><circle cx="496" cy="135" r="14" fill="#3ddc97"/><text x="496" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="496.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Draw</text><text x="496.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Clear + render frame</text><line x1="586.0" y1="232.0" x2="612.0" y2="232.0" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><rect x="612.0" y="137.0" width="152.0" height="190" rx="10" fill="#16202f" stroke="#3ddc97" stroke-width="1.5"/><circle cx="688" cy="135" r="14" fill="#fbbf24"/><text x="688" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="688.0" y="177.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="14.5" font-weight="700" fill="#e9f1f4" text-anchor="middle">Loop</text><text x="688.0" y="200.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">requestAnimationFrame</text><text x="688.0" y="215.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">(tick)</text></svg>