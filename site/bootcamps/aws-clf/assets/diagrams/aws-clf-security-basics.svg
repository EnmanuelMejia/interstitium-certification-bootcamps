<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Defense in Depth on AWS</title><desc>Stacked layers, top to bottom: Edge &gt; Network &gt; Identity &gt; Data &gt; Detective</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Defense in Depth on AWS</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Security controls stacked from the edge down to the data.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="100" y="107.0" width="600" height="52.0" rx="9" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="100" y="107.0" width="600" height="52.0" rx="9" fill="#3ddc97" opacity="0.06"/><circle cx="130" cy="133" r="14" fill="#3ddc97"/><text x="130" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">5</text><text x="154" y="129.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Edge</text><text x="154" y="147.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12" fill="#93a4b8">WAF, Shield, CloudFront</text><line x1="400" y1="159.0" x2="400" y2="167.0" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="100" y="167.0" width="600" height="52.0" rx="9" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="100" y="167.