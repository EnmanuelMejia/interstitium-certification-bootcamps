<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Multi-AZ Resilient Architecture</title><desc>Tiered architecture: DNS / Load balancing / Compute / Data</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Multi-AZ Resilient Architecture</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Design so the failure of one Availability Zone changes nothing for users.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="36" y="107.0" width="728" height="63.8" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="134.9" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">DNS</text><text x="52" y="152.9" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 1</text><rect x="274.0" y="119.0" width="200.0" height="39.8" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="374.0" y="134.9" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Route 53 health checks</text><rect x="486.0" y="119.0" width="200.0" height="39.8" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="586.0" y="134.9" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Multi-region failover</text><line x1="400" y1="170.8" x2="400" y2="192.8" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="36" y="192.8" width="728" height="63.8" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="220.6" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Load balancing</text><text x="52" y="238.6" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 2</text><rect x="380.0" y="204.8" width="200.0" height="39.8" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="480.0" y="220.6" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">ALB across AZs</text><line x1="400" y1="256.5" x2="400" y2="278.5" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="36" y="278.5" width="728" height="63.8" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="306.4" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Compute</text><text x="52" y="324.4" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 3</text><rect x="380.0" y="290.5" width="200.0" height="39.8" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="480.0" y="306.4" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Auto Scaling in 2+ AZs</text><line x1="400" y1="342.2" x2="400" y2="364.2" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="36" y="364.2" width="728" height="63.8" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="392.1" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Data</text><text x="52" y="410.1" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 4</text><rect x="274.0" y="376.2" width="200.0" height="39.8" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="374.0" y="392.1" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">RDS Multi-AZ</text><rect x="486.0" y="376.2" width="200.0" height="39.8" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="586.0" y="392.1" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">S3 cross-region</text><text x="586.0" y="408.1" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">replication</text></svg>