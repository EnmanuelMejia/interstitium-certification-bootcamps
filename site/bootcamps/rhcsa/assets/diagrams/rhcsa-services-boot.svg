<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>systemd Service Management</title><desc>Command reference: systemctl start nginx, systemctl enable nginx, systemctl status nginx, systemctl restart sshd, journalctl -u nginx -f, systemctl daemon-reload</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">systemd Service Management</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Control services and inspect boots.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">systemctl start nginx</text><text x="50" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Start a service now</text><rect x="408" y="107.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="131.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">systemctl enable nginx</text><text x="422" y="151.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Start at boot</text><rect x="36" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">systemctl status nginx</text><text x="50" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">State + recent logs</text><rect x="408" y="183.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="207.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">systemctl restart sshd</text><text x="422" y="227.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Restart a service</text><rect x="36" y="259.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="50" y="283.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">journalctl -u nginx -f</text><text x="50" y="303.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Follow service logs</text><rect x="408" y="259.0" width="356" height="66.0" rx="8" fill="#060b11" stroke="#223046" stroke-width="1"/><text x="422" y="283.0" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13.5" font-weight="700" fill="#b9f5d8">systemctl daemon-reload</text><text x="422" y="303.0" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8">Reload unit files</text></svg>