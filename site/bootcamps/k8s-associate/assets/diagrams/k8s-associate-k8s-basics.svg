<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Kubernetes Building Blocks</title><desc>Tiered architecture: Control plane / Worker node / Workloads</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Kubernetes Building Blocks</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">The smallest units, composed upward.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="36" y="107.0" width="728" height="92.3" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="149.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Control plane</text><text x="52" y="167.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 1</text><rect x="200.0" y="125.2" width="131.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="265.5" y="149.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">kube-apiserver</text><rect x="343.0" y="125.2" width="131.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="408.5" y="149.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">etcd</text><rect x="486.0" y="125.2" width="131.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="551.5" y="149.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">kube-scheduler</text><rect x="629.0" y="125.2" width="131.0" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="694.5" y="149.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">kube-controller-m</text><text x="694.5" y="165.2" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">anager</text><line x1="400" y1="199.3" x2="400" y2="221.3" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="36" y="221.3" width="728" height="92.3" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="263.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Worker node</text><text x="52" y="281.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 2</text><rect x="200.0" y="239.5" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="289.3" y="263.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">kubelet</text><rect x="390.7" y="239.5" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="480.0" y="263.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">kube-proxy</text><rect x="581.3" y="239.5" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="670.7" y="263.5" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">container runtime</text><line x1="400" y1="313.7" x2="400" y2="335.7" stroke="#93a4b8" stroke-width="2" marker-end="url(#ahm)"/><rect x="36" y="335.7" width="728" height="92.3" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><text x="52" y="377.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="700" fill="#3ddc97">Workloads</text><text x="52" y="395.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11" fill="#93a4b8">tier 3</text><rect x="200.0" y="353.8" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="289.3" y="377.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Pod</text><rect x="390.7" y="353.8" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="480.0" y="377.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Deployment</text><rect x="581.3" y="353.8" width="178.7" height="56.0" rx="8" fill="#16202f" stroke="#223046" stroke-width="1.2"/><text x="670.7" y="377.8" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="600" fill="#e9f1f4" text-anchor="middle">Service</text></svg>