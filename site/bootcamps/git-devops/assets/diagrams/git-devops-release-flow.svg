<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Release Flow: GitFlow vs Trunk</title><desc>Git branching: release/2.4 branches from main and merges back</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Release Flow: GitFlow vs Trunk</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Long-lived release branches vs short-lived trunk commits.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><line x1="80" y1="257" x2="720" y2="257" stroke="#3ddc97" stroke-width="3"/><text x="80" y="291" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13" font-weight="700" fill="#3ddc97">main</text><circle cx="140" cy="257" r="9" fill="#0a0e14" stroke="#3ddc97" stroke-width="2"/><circle cx="260" cy="257" r="9" fill="#0a0e14" stroke="#3ddc97" stroke-width="2"/><circle cx="380" cy="257" r="9" fill="#0a0e14" stroke="#3ddc97" stroke-width="2"/><circle cx="500" cy="257" r="9" fill="#0a0e14" stroke="#3ddc97" stroke-width="2"/><circle cx="640" cy="257" r="9" fill="#0a0e14" stroke="#3ddc97" stroke-width="2"/><line x1="200" y1="167" x2="560" y2="167" stroke="#a78bfa" stroke-width="3"/><line x1="200" y1="167" x2="200" y2="245" stroke="#a78bfa" stroke-width="2" marker-end="url(#ah)"/><line x1="560" y1="167" x2="560" y2="245" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ah)"/><circle cx="290" cy="167" r="9" fill="#0a0e14" stroke="#a78bfa" stroke-width="2"/><circle cx="410" cy="167" r="9" fill="#0a0e14" stroke="#a78bfa" stroke-width="2"/><circle cx="530" cy="167" r="9" fill="#0a0e14" stroke="#a78bfa" stroke-width="2"/><text x="200" y="143" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="13" font-weight="700" fill="#a78bfa">release/2.4</text><text x="50" y="173" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="12" fill="#93a4b8">git checkout -b release/2.4</text><text x="576" y="173" font-family='ui-monospace,SF Mono,Menlo,Consolas,monospace' font-size="12" fill="#93a4b8">git merge release/2.4</text><text x="36" y="319" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Each circle is a commit. Feature work stays isolated until the merge commit joins it back to main.</text></svg>