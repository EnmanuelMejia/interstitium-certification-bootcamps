<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="500" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">Static vs DHCP — 50 Workstations, One Tired Admin</text>

  <!-- LEFT: manual -->
  <rect x="30" y="60" width="355" height="380" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="207" y="88" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Manual static config</text>
  <text x="207" y="108" text-anchor="middle" fill="#8b949e" font-size="11">touch every machine · type every octet</text>

  <g font-size="10" text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.02;0.08" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="52" y="128" width="96" height="52" rx="6" fill="#0d1117" stroke="#f85149"/><text x="100" y="150" fill="#e6edf3">PC-01</text><text x="100" y="166" fill="#8b949e">192.168.1.10</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.10;0.16" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="160" y="128" width="96" height="52" rx="6" fill="#0d1117" stroke="#f85149"/><text x="208" y="150" fill="#e6edf3">PC-02</text><text x="208" y="166" fill="#8b949e">192.168.1.11</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.18;0.24" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="268" y="128" width="96" height="52" rx="6" fill="#0d1117" stroke="#f85149"/><text x="316" y="150" fill="#e6edf3">PC-03</text><text x="316" y="166" fill="#8b949e">192.168.1.12</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.26;0.32" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="52" y="196" width="96" height="52" rx="6" fill="#0d1117" stroke="#f85149"/><text x="100" y="218" fill="#e6edf3">PC-04</text><text x="100" y="234" fill="#8b949e">192.168.1.13</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.34;0.40" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="160" y="196" width="96" height="52" rx="6" fill="#0d1117" stroke="#f85149"/><text x="208" y="218" fill="#e6edf3">PC-05</text><text x="208" y="234" fill="#8b949e">192.168.1.12</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.42;0.48" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="268" y="196" width="96" height="52" rx="6" fill="#0d1117" stroke="#f85149"/><text x="316" y="218" fill="#e6edf3">PC-06</text><text x="316" y="234" fill="#8b949e">192.168.1.15</text></g>
  </g>

  <!-- conflict flash -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.50;0.55;0.70;0.75" dur="16s" repeatCount="indefinite"/>
    <rect x="268" y="128" width="96" height="52" rx="6" fill="none" stroke="#da3633" stroke-width="4"/>
    <rect x="160" y="196" width="96" height="52" rx="6" fill="none" stroke="#da3633" stroke-width="4"/>
    <text x="207" y="292" text-anchor="middle" fill="#da3633" font-size="14" font-weight="700">⚠ DUPLICATE IP — PC-03 vs PC-05 (.12)</text>
    <text x="207" y="314" text-anchor="middle" fill="#8b949e" font-size="11">typo'd octet · both machines drop off the network</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.72;0.78;0.95;1" dur="16s" repeatCount="indefinite"/>
    <rect x="67" y="352" width="280" height="40" rx="20" fill="#f85149" opacity="0.12" stroke="#f85149" stroke-width="2"/>
    <text x="207" y="377" text-anchor="middle" fill="#f85149" font-size="13" font-weight="700">⏱ ~45 min + troubleshooting</text>
  </g>

  <!-- RIGHT: DHCP -->
  <rect x="415" y="60" width="355" height="380" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="592" y="88" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">DHCP automation</text>
  <text x="592" y="108" text-anchor="middle" fill="#8b949e" font-size="11">one scope · DORA does the rest</text>

  <rect x="517" y="118" width="150" height="40" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="592" y="143" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">DHCP Server</text>

  <g font-size="10" text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.02;0.06" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="437" y="172" width="96" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/><text x="485" y="194" fill="#3fb950" font-weight="700">✓</text><text x="485" y="210" fill="#8b949e">.50 leased</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.08;0.12" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="545" y="172" width="96" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/><text x="593" y="194" fill="#3fb950" font-weight="700">✓</text><text x="593" y="210" fill="#8b949e">.51 leased</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.14;0.18" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="653" y="172" width="96" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/><text x="701" y="194" fill="#3fb950" font-weight="700">✓</text><text x="701" y="210" fill="#8b949e">.52 leased</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.20;0.24" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="437" y="240" width="96" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/><text x="485" y="262" fill="#3fb950" font-weight="700">✓</text><text x="485" y="278" fill="#8b949e">.53 leased</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.26;0.30" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="545" y="240" width="96" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/><text x="593" y="262" fill="#3fb950" font-weight="700">✓</text><text x="593" y="278" fill="#8b949e">.54 leased</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.32;0.36" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="653" y="240" width="96" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/><text x="701" y="262" fill="#3fb950" font-weight="700">✓</text><text x="701" y="278" fill="#8b949e">.55 leased</text></g>
  </g>

  <!-- offer pulses -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.02;0.06;0.32;0.38" dur="16s" repeatCount="indefinite"/>
    <line x1="592" y1="158" x2="485" y2="172" stroke="#3fb950" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="592" y1="158" x2="701" y2="172" stroke="#3fb950" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="592" y="322" text-anchor="middle" fill="#8b949e" font-size="11">gateway · DNS · domain delivered via DHCP options — no typos possible</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.72;0.78;0.95;1" dur="16s" repeatCount="indefinite"/>
    <rect x="452" y="352" width="280" height="40" rx="20" fill="#3fb950" opacity="0.12" stroke="#3fb950" stroke-width="2"/>
    <text x="592" y="377" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">⏱ ~45 sec — zero touch</text>
  </g>

  <text x="400" y="470" text-anchor="middle" fill="#8b949e" font-size="12">DORA = Discover · Offer · Request · Acknowledge · static = human error at scale · DHCP = consistency at scale</text>
</svg>
