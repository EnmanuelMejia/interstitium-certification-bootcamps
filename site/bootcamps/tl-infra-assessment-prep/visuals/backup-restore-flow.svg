<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="barr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">Backup → Restore Flow — Full · Differential · Log Chain</text>
  <text x="400" y="52" text-anchor="middle" fill="#8b949e" font-size="12">A week under the FULL recovery model — then the restore that saves the day</text>

  <!-- Timeline -->
  <g font-size="11" text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.04" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="70" y="90" width="86" height="52" rx="6" fill="#3fb950" opacity="0.2" stroke="#3fb950" stroke-width="2"/>
      <text x="113" y="111" fill="#3fb950" font-weight="700">FULL</text><text x="113" y="128" fill="#8b949e">Sun · LSN 100</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.04;0.08" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="164" y="98" width="86" height="36" rx="6" fill="#58a6ff" opacity="0.2" stroke="#58a6ff"/>
      <text x="207" y="121" fill="#58a6ff" font-weight="700">LOG</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.08;0.12" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="258" y="98" width="86" height="36" rx="6" fill="#58a6ff" opacity="0.2" stroke="#58a6ff"/>
      <text x="301" y="121" fill="#58a6ff" font-weight="700">LOG</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.12;0.16" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="352" y="90" width="86" height="52" rx="6" fill="#d29922" opacity="0.2" stroke="#d29922" stroke-width="2"/>
      <text x="395" y="111" fill="#d29922" font-weight="700">DIFF</text><text x="395" y="128" fill="#8b949e">Wed · LSN 140</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.16;0.20" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="446" y="98" width="86" height="36" rx="6" fill="#58a6ff" opacity="0.2" stroke="#58a6ff"/>
      <text x="489" y="121" fill="#58a6ff" font-weight="700">LOG</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.20;0.24" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="540" y="98" width="86" height="36" rx="6" fill="#58a6ff" opacity="0.2" stroke="#58a6ff"/>
      <text x="583" y="121" fill="#58a6ff" font-weight="700">LOG</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.24;0.28" dur="16s" repeatCount="indefinite" fill="freeze"/>
      <rect x="634" y="90" width="86" height="52" rx="6" fill="#d29922" opacity="0.2" stroke="#d29922" stroke-width="2"/>
      <text x="677" y="111" fill="#d29922" font-weight="700">DIFF</text><text x="677" y="128" fill="#8b949e">Sat · LSN 180</text></g>
  </g>

  <!-- LSN chain -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.28;0.34;0.52;0.58" dur="16s" repeatCount="indefinite"/>
    <line x1="113" y1="160" x2="395" y2="160" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#barr)">
      <animate attributeName="stroke-dashoffset" values="0;-44" keyTimes="0;1" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="395" y1="160" x2="677" y2="160" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#barr)">
      <animate attributeName="stroke-dashoffset" values="0;-44" keyTimes="0;1" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <text x="400" y="184" text-anchor="middle" fill="#8b949e" font-size="12">LSN chain unbroken: every backup's FirstLSN = the previous backup's LastLSN</text>
  </g>

  <!-- Restore panel -->
  <rect x="90" y="212" width="620" height="196" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="400" y="238" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Restore sequence — disaster strikes Thursday</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.58;0.62;0.70;0.74" dur="16s" repeatCount="indefinite"/>
    <rect x="120" y="252" width="560" height="36" rx="6" fill="#3fb950" opacity="0.12" stroke="#3fb950"/>
    <text x="140" y="275" fill="#3fb950" font-size="12" font-weight="600">1 · RESTORE DATABASE FROM <tspan font-weight="700">FULL</tspan> (Sun) … WITH NORECOVERY</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.70;0.74;0.82;0.86" dur="16s" repeatCount="indefinite"/>
    <rect x="120" y="296" width="560" height="36" rx="6" fill="#d29922" opacity="0.12" stroke="#d29922"/>
    <text x="140" y="319" fill="#d29922" font-size="12" font-weight="600">2 · RESTORE DATABASE FROM <tspan font-weight="700">DIFF</tspan> (Wed) … WITH NORECOVERY</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.82;0.86;0.92;0.96" dur="16s" repeatCount="indefinite"/>
    <rect x="120" y="340" width="560" height="36" rx="6" fill="#58a6ff" opacity="0.12" stroke="#58a6ff"/>
    <text x="140" y="363" fill="#58a6ff" font-size="12" font-weight="600">3 · RESTORE LOG (Wed→Thu, in LSN order) … <tspan font-weight="700">WITH RECOVERY</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.90;0.94;0.98;1" dur="16s" repeatCount="indefinite"/>
    <text x="400" y="440" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">✓ Database ONLINE — current to the last log backup</text>
  </g>

  <text x="400" y="470" text-anchor="middle" fill="#8b949e" font-size="12">Golden rule: FULL → most recent DIFF → every LOG after that DIFF, in LSN order · NORECOVERY until the final log</text>
</svg>
