<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="sarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">STP Convergence — Root Election to Loop-Free Tree</text>

  <!-- Links -->
  <line x1="350" y1="140" x2="205" y2="335" stroke="#58a6ff" stroke-width="3"/>
  <line x1="450" y1="140" x2="595" y2="335" stroke="#58a6ff" stroke-width="3"/>
  <line id="bc-link" x1="260" y1="372" x2="540" y2="372" stroke="#58a6ff" stroke-width="3"/>
  <line x1="260" y1="372" x2="540" y2="372" stroke="#da3633" stroke-width="3" stroke-dasharray="10 8" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.68;0.72;0.95;1" dur="18s" repeatCount="indefinite"/>
  </line>

  <!-- BPDU pulses -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.18;0.22" dur="18s" repeatCount="indefinite"/>
    <circle cx="350" cy="140" r="7" fill="#d29922">
      <animate attributeName="cx" values="350;205" keyTimes="0;1" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;335" keyTimes="0;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="140" r="7" fill="#d29922">
      <animate attributeName="cx" values="450;595" keyTimes="0;1" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;335" keyTimes="0;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="372" r="7" fill="#d29922">
      <animate attributeName="cx" values="260;540" keyTimes="0;1" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="372;372" keyTimes="0;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Switches -->
  <rect x="345" y="76" width="110" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#3fb950;#3fb950;#30363d" keyTimes="0.20;0.30;0.95;1" dur="18s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="100" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">SW-A</text>
  <text x="400" y="122" text-anchor="middle" fill="#8b949e" font-size="10">BID 32768:00:11</text>

  <rect x="145" y="340" width="110" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="200" y="364" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">SW-B</text>
  <text x="200" y="386" text-anchor="middle" fill="#8b949e" font-size="10">BID 32768:00:22</text>

  <rect x="545" y="340" width="110" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="364" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">SW-C</text>
  <text x="600" y="386" text-anchor="middle" fill="#8b949e" font-size="10">BID 32768:00:33</text>

  <!-- Crown badge -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.22;0.28;0.95;1" dur="18s" repeatCount="indefinite"/>
    <rect x="330" y="34" width="140" height="30" rx="15" fill="#d29922" opacity="0.15" stroke="#d29922" stroke-width="2"/>
    <text x="400" y="54" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700">♛ ROOT BRIDGE</text>
  </g>

  <!-- RP chips on B and C -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.45;0.50;0.95;1" dur="18s" repeatCount="indefinite"/>
    <rect x="196" y="300" width="52" height="24" rx="12" fill="#3fb950" opacity="0.15" stroke="#3fb950"/>
    <text x="222" y="317" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">RP</text>
    <rect x="552" y="300" width="52" height="24" rx="12" fill="#3fb950" opacity="0.15" stroke="#3fb950"/>
    <text x="578" y="317" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">RP</text>
  </g>

  <!-- DP chips on A -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.50;0.55;0.95;1" dur="18s" repeatCount="indefinite"/>
    <rect x="300" y="140" width="52" height="24" rx="12" fill="#58a6ff" opacity="0.15" stroke="#58a6ff"/>
    <text x="326" y="157" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">DP</text>
    <rect x="448" y="140" width="52" height="24" rx="12" fill="#58a6ff" opacity="0.15" stroke="#58a6ff"/>
    <text x="474" y="157" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">DP</text>
  </g>

  <!-- Blocking port on B-C link (C side) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.66;0.71;0.95;1" dur="18s" repeatCount="indefinite"/>
    <text x="545" y="360" text-anchor="middle" fill="#da3633" font-size="18" font-weight="700">✗</text>
    <rect x="512" y="384" width="66" height="24" rx="12" fill="#da3633" opacity="0.15" stroke="#da3633"/>
    <text x="545" y="401" text-anchor="middle" fill="#da3633" font-size="11" font-weight="700">BLOCKING</text>
  </g>

  <!-- Port state cycle on B side of B-C link -->
  <g>
    <rect x="222" y="384" width="66" height="24" rx="12" fill="#da3633" opacity="0.15" stroke="#da3633">
      <animate attributeName="stroke" values="#da3633;#d29922;#d29922;#3fb950;#da3633" keyTimes="0.66;0.76;0.84;0.92;1" dur="18s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.66;0.70;0.74;0.78" dur="18s" repeatCount="indefinite"/>
      <text x="255" y="401" text-anchor="middle" fill="#da3633" font-size="11" font-weight="700">BLK</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.74;0.78;0.82;0.86" dur="18s" repeatCount="indefinite"/>
      <text x="255" y="401" text-anchor="middle" fill="#d29922" font-size="11" font-weight="700">LSN</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.82;0.86;0.90;0.94" dur="18s" repeatCount="indefinite"/>
      <text x="255" y="401" text-anchor="middle" fill="#d29922" font-size="11" font-weight="700">LRN</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.90;0.94;0.98;1" dur="18s" repeatCount="indefinite"/>
      <text x="255" y="401" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">FWD</text></g>
  </g>

  <!-- Phase narration -->
  <g font-size="13" text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.18;0.22" dur="18s" repeatCount="indefinite"/>
      <text x="400" y="440" fill="#d29922" font-weight="600">Phase 1 · BPDUs exchanged — Bridge IDs compared</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.22;0.26;0.42;0.46" dur="18s" repeatCount="indefinite"/>
      <text x="400" y="440" fill="#d29922" font-weight="600">Phase 2 · SW-A wins — lowest Bridge ID (32768:00:11)</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.45;0.49;0.64;0.68" dur="18s" repeatCount="indefinite"/>
      <text x="400" y="440" fill="#3fb950" font-weight="600">Phase 3 · Root Ports (RP) = shortest path to root · rest are Designated (DP)</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.66;0.70;0.96;1" dur="18s" repeatCount="indefinite"/>
      <text x="400" y="440" fill="#58a6ff" font-weight="600">Phase 4 · Redundant link blocked → port cycles BLK → LSN → LRN → FWD</text></g>
  </g>

  <text x="400" y="470" text-anchor="middle" fill="#8b949e" font-size="12">Loop-free tree: 1 Root Bridge · 1 Root Port per non-root switch · 1 Designated Port per segment · everything else Blocking</text>
</svg>
