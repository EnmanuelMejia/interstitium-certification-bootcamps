<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="garr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">GPO Precedence — LSDOU: Last Writer Wins</text>
  <text x="400" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Same setting defined at every level — watch each layer overwrite the last</text>

  <!-- Plates -->
  <g>
    <rect x="70" y="100" width="290" height="66" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="90" y="126" fill="#e6edf3" font-size="14" font-weight="600">L · Local GPO</text>
    <text x="90" y="148" fill="#8b949e" font-size="11">applies 1st · Wallpaper = <tspan fill="#58a6ff" font-weight="700">Blue</tspan></text>
    <rect x="70" y="100" width="290" height="66" rx="8" fill="none" stroke="#58a6ff" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.20;0.25" dur="14s" repeatCount="indefinite"/>
    </rect>

    <rect x="70" y="182" width="290" height="66" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="90" y="208" fill="#e6edf3" font-size="14" font-weight="600">S · Site GPO</text>
    <text x="90" y="230" fill="#8b949e" font-size="11">applies 2nd · Wallpaper = <tspan fill="#f85149" font-weight="700">Red</tspan></text>
    <rect x="70" y="182" width="290" height="66" rx="8" fill="none" stroke="#f85149" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.25;0.27;0.45;0.50" dur="14s" repeatCount="indefinite"/>
    </rect>

    <rect x="70" y="264" width="290" height="66" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="90" y="290" fill="#e6edf3" font-size="14" font-weight="600">D · Domain GPO</text>
    <text x="90" y="312" fill="#8b949e" font-size="11">applies 3rd · Wallpaper = <tspan fill="#a371f7" font-weight="700">Purple</tspan></text>
    <rect x="70" y="264" width="290" height="66" rx="8" fill="none" stroke="#a371f7" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.50;0.52;0.70;0.75" dur="14s" repeatCount="indefinite"/>
    </rect>

    <rect x="70" y="346" width="290" height="66" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="90" y="372" fill="#e6edf3" font-size="14" font-weight="600">OU · OU GPO</text>
    <text x="90" y="394" fill="#8b949e" font-size="11">applies 4th (last) · Wallpaper = <tspan fill="#3fb950" font-weight="700">Green</tspan></text>
    <rect x="70" y="346" width="290" height="66" rx="8" fill="none" stroke="#3fb950" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0.75;0.77;0.85;0.96;1" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Apply arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.70;0.75" dur="14s" repeatCount="indefinite"/>
    <line x1="360" y1="230" x2="440" y2="230" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#garr)"/>
    <text x="400" y="216" text-anchor="middle" fill="#8b949e" font-size="11">applying in order ↓</text>
  </g>

  <!-- Target -->
  <rect x="460" y="140" width="270" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="595" y="168" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">DESKTOP-042</text>
  <text x="595" y="192" text-anchor="middle" fill="#8b949e" font-size="11">resultant Wallpaper setting:</text>

  <g font-size="22" font-weight="700" text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.02;0.06;0.21;0.25" dur="14s" repeatCount="indefinite"/>
      <text x="595" y="250" fill="#58a6ff">Blue</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.27;0.31;0.46;0.50" dur="14s" repeatCount="indefinite"/>
      <text x="595" y="250" fill="#f85149">Red</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.52;0.56;0.71;0.75" dur="14s" repeatCount="indefinite"/>
      <text x="595" y="250" fill="#a371f7">Purple</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.77;0.81;0.96;1" dur="14s" repeatCount="indefinite"/>
      <text x="595" y="250" fill="#3fb950">Green</text></g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.81;0.86;0.96;1" dur="14s" repeatCount="indefinite"/>
    <rect x="497" y="276" width="196" height="38" rx="19" fill="#3fb950" opacity="0.12" stroke="#3fb950" stroke-width="2"/>
    <text x="595" y="301" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">✓ OU WINS — applied last</text>
  </g>

  <text x="400" y="452" text-anchor="middle" fill="#8b949e" font-size="12">LSDOU = Local → Site → Domain → OU · Conflicts resolve to the LAST applied policy</text>
  <text x="400" y="474" text-anchor="middle" fill="#8b949e" font-size="12">Overrides: <tspan fill="#d29922" font-weight="600">Enforced</tspan> GPOs beat <tspan fill="#d29922" font-weight="600">Block Inheritance</tspan> · child OUs apply after parent OUs</text>
</svg>
