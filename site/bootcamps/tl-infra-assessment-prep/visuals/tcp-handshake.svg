<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="tarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="tarrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">TCP 3-Way Handshake</text>

  <!-- Client -->
  <rect x="60" y="180" width="150" height="80" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="135" y="208" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Client</text>
  <text x="135" y="230" text-anchor="middle" fill="#8b949e" font-size="11">port 49231</text>

  <!-- Server -->
  <rect x="590" y="180" width="150" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="665" y="208" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Server</text>
  <text x="665" y="230" text-anchor="middle" fill="#8b949e" font-size="11">port 443</text>

  <!-- 1. SYN -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.28;0.33" dur="15s" repeatCount="indefinite"/>
    <line x1="210" y1="140" x2="590" y2="140" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#tarr)"/>
    <circle cx="210" cy="140" r="9" fill="#58a6ff">
      <animate attributeName="cx" values="210;590" keyTimes="0.03;0.24" dur="15s" repeatCount="indefinite" fill="freeze"/>
    </circle>
    <text x="400" y="124" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">1 · SYN — seq=1000</text>
    <text x="400" y="162" text-anchor="middle" fill="#8b949e" font-size="11">"Can we talk? My starting sequence is 1000."</text>
  </g>

  <!-- 2. SYN-ACK -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.30;0.33;0.58;0.63" dur="15s" repeatCount="indefinite"/>
    <line x1="590" y1="235" x2="210" y2="235" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#tarrg)"/>
    <circle cx="590" cy="235" r="9" fill="#3fb950">
      <animate attributeName="cx" values="590;210" keyTimes="0.34;0.54" dur="15s" repeatCount="indefinite" fill="freeze"/>
    </circle>
    <text x="400" y="219" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">2 · SYN-ACK — seq=5000, ack=1001</text>
    <text x="400" y="257" text-anchor="middle" fill="#8b949e" font-size="11">"Yes — my sequence starts at 5000, and I got your 1000."</text>
  </g>

  <!-- 3. ACK -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.60;0.63;0.88;0.93" dur="15s" repeatCount="indefinite"/>
    <line x1="210" y1="330" x2="590" y2="330" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#tarr)"/>
    <circle cx="210" cy="330" r="9" fill="#58a6ff">
      <animate attributeName="cx" values="210;590" keyTimes="0.64;0.84" dur="15s" repeatCount="indefinite" fill="freeze"/>
    </circle>
    <text x="400" y="314" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">3 · ACK — seq=1001, ack=5001</text>
    <text x="400" y="352" text-anchor="middle" fill="#8b949e" font-size="11">"Confirmed — I got your 5000. Connection is open."</text>
  </g>

  <!-- Established -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.88;0.93;0.97;1" dur="15s" repeatCount="indefinite"/>
    <rect x="250" y="392" width="300" height="40" rx="20" fill="#3fb950" opacity="0.12"/>
    <rect x="250" y="392" width="300" height="40" rx="20" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="400" y="417" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="600">✓ ESTABLISHED — data flows both ways</text>
  </g>

  <text x="400" y="455" text-anchor="middle" fill="#8b949e" font-size="12">SYN consumes one sequence number — the ACK is always received-seq + 1 · Teardown mirrors this with FIN/ACK</text>
</svg>
