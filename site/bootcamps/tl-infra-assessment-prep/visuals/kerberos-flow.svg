<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="karrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="karrp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a371f7"/>
    </marker>
    <marker id="karrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">Kerberos Ticket Exchange — Six Messages, Zero Passwords on the Wire</text>

  <!-- Client -->
  <rect x="60" y="180" width="140" height="80" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="130" y="208" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Client</text>
  <text x="130" y="230" text-anchor="middle" fill="#8b949e" font-size="11">user workstation</text>

  <!-- KDC -->
  <rect x="330" y="180" width="140" height="80" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="400" y="204" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">KDC</text>
  <text x="400" y="226" text-anchor="middle" fill="#8b949e" font-size="11">AS + TGS (domain controller)</text>

  <!-- Server -->
  <rect x="600" y="180" width="140" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="670" y="208" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">File Server</text>
  <text x="670" y="230" text-anchor="middle" fill="#8b949e" font-size="11">service to access</text>

  <!-- 1. AS-REQ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.015;0.12;0.14" dur="18s" repeatCount="indefinite"/>
    <line x1="200" y1="130" x2="330" y2="130" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#karrb)"/>
    <circle cx="200" cy="130" r="8" fill="#58a6ff">
      <animate attributeName="cx" values="200;330" keyTimes="0.02;0.10" dur="18s" repeatCount="indefinite" fill="freeze"/>
    </circle>
    <text x="265" y="112" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">1 · AS-REQ</text>
    <text x="265" y="152" text-anchor="middle" fill="#8b949e" font-size="10.5">"It's me" — timestamp encrypted with password-derived key</text>
  </g>

  <!-- 2. AS-REP -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.15;0.165;0.27;0.29" dur="18s" repeatCount="indefinite"/>
    <line x1="330" y1="170" x2="200" y2="170" stroke="#a371f7" stroke-width="2.5" marker-end="url(#karrp)"/>
    <circle cx="330" cy="170" r="8" fill="#a371f7">
      <animate attributeName="cx" values="330;200" keyTimes="0.17;0.25" dur="18s" repeatCount="indefinite" fill="freeze"/>
    </circle>
    <text x="265" y="192" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="600">2 · AS-REP — TGT</text>
    <text x="400" y="300" text-anchor="middle" fill="#a371f7" font-size="11">Ticket-Granting Ticket: proves identity for ~10 hrs, no re-login</text>
  </g>

  <!-- 3. TGS-REQ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.30;0.315;0.42;0.44" dur="18s" repeatCount="indefinite"/>
    <line x1="200" y1="130" x2="330" y2="130" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#karrb)"/>
    <circle cx="200" cy="130" r="8" fill="#58a6ff">
      <animate attributeName="cx" values="200;330" keyTimes="0.32;0.40" dur="18s" repeatCount="indefinite" fill="freeze"/>
    </circle>
    <text x="265" y="112" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">3 · TGS-REQ</text>
    <text x="265" y="152" text-anchor="middle" fill="#8b949e" font-size="10.5">"TGT enclosed — I need a ticket for the FILE SERVER"</text>
  </g>

  <!-- 4. TGS-REP -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.45;0.465;0.57;0.59" dur="18s" repeatCount="indefinite"/>
    <line x1="330" y1="170" x2="200" y2="170" stroke="#a371f7" stroke-width="2.5" marker-end="url(#karrp)"/>
    <circle cx="330" cy="170" r="8" fill="#a371f7">
      <animate attributeName="cx" values="330;200" keyTimes="0.47;0.55" dur="18s" repeatCount="indefinite" fill="freeze"/>
    </circle>
    <text x="265" y="192" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="600">4 · TGS-REP — service ticket</text>
    <text x="400" y="300" text-anchor="middle" fill="#a371f7" font-size="11">Encrypted with the service's key — only the file server can read it</text>
  </g>

  <!-- 5. AP-REQ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.60;0.615;0.73;0.75" dur="18s" repeatCount="indefinite"/>
    <line x1="200" y1="300" x2="600" y2="300" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#karrg)"/>
    <circle cx="200" cy="300" r="8" fill="#3fb950">
      <animate attributeName="cx" values="200;600" keyTimes="0.62;0.71" dur="18s" repeatCount="indefinite" fill="freeze"/>
    </circle>
    <text x="400" y="282" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">5 · AP-REQ — presents service ticket</text>
    <text x="400" y="322" text-anchor="middle" fill="#8b949e" font-size="11">KDC is out of the loop — ticket + authenticator prove identity directly</text>
  </g>

  <!-- 6. Granted -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.81;0.96;1" dur="18s" repeatCount="indefinite"/>
    <rect x="520" y="356" width="220" height="40" rx="20" fill="#3fb950" opacity="0.12"/>
    <rect x="520" y="356" width="220" height="40" rx="20" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="630" y="381" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">6 · ✓ Access granted</text>
    <text x="400" y="440" text-anchor="middle" fill="#8b949e" font-size="12">Mutual authentication optional (AP-REP) · Password never crossed the network — only encrypted tickets did</text>
  </g>

  <text x="400" y="472" text-anchor="middle" fill="#8b949e" font-size="12">Remember: AS = Authentication Service (logon) · TGS = Ticket-Granting Service (per-service tickets)</text>
</svg>
