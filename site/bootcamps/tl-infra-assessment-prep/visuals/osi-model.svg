<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="oarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">OSI Model — Data Encapsulation</text>
  <text x="400" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Watch the payload grow headers as it descends the stack</text>

  <!-- 7 layers -->
  <g font-size="13">
    <rect x="50" y="78" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="66" y="112" fill="#a371f7" font-weight="700">7</text>
    <text x="90" y="104" fill="#e6edf3" font-weight="600">Application</text>
    <text x="90" y="122" fill="#8b949e" font-size="10">HTTP · DNS · SMB</text>

    <rect x="50" y="142" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="66" y="176" fill="#a371f7" font-weight="700">6</text>
    <text x="90" y="168" fill="#e6edf3" font-weight="600">Presentation</text>
    <text x="90" y="186" fill="#8b949e" font-size="10">encoding · TLS encryption</text>

    <rect x="50" y="206" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="66" y="240" fill="#a371f7" font-weight="700">5</text>
    <text x="90" y="232" fill="#e6edf3" font-weight="600">Session</text>
    <text x="90" y="250" fill="#8b949e" font-size="10">dialogs · NetBIOS sessions</text>

    <rect x="50" y="270" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="66" y="304" fill="#58a6ff" font-weight="700">4</text>
    <text x="90" y="296" fill="#e6edf3" font-weight="600">Transport</text>
    <text x="90" y="314" fill="#8b949e" font-size="10">ports · TCP / UDP</text>

    <rect x="50" y="334" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="66" y="368" fill="#58a6ff" font-weight="700">3</text>
    <text x="90" y="360" fill="#e6edf3" font-weight="600">Network</text>
    <text x="90" y="378" fill="#8b949e" font-size="10">IP addressing · routing</text>

    <rect x="50" y="398" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="66" y="432" fill="#58a6ff" font-weight="700">2</text>
    <text x="90" y="424" fill="#e6edf3" font-weight="600">Data Link</text>
    <text x="90" y="442" fill="#8b949e" font-size="10">MAC · Ethernet switching</text>

    <rect x="50" y="462" width="230" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="66" y="496" fill="#58a6ff" font-weight="700">1</text>
    <text x="90" y="488" fill="#e6edf3" font-weight="600">Physical</text>
    <text x="90" y="506" fill="#8b949e" font-size="10">bits · cables · hubs</text>
  </g>

  <!-- Layer highlight overlays (pulse as encapsulation passes) -->
  <rect x="50" y="78" width="230" height="56" rx="8" fill="none" stroke="#2f81f7" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.20;0.24" dur="16s" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="270" width="230" height="56" rx="8" fill="none" stroke="#2f81f7" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.22;0.26;0.44;0.48" dur="16s" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="334" width="230" height="56" rx="8" fill="none" stroke="#2f81f7" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.46;0.50;0.68;0.72" dur="16s" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="398" width="230" height="56" rx="8" fill="none" stroke="#2f81f7" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.70;0.74;0.92;0.96" dur="16s" repeatCount="indefinite"/>
  </rect>

  <!-- Encapsulation column -->
  <!-- Stage A: data -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.20;0.24" dur="16s" repeatCount="indefinite"/>
    <rect x="360" y="86" width="120" height="40" rx="6" fill="#2f81f7" opacity="0.25" stroke="#2f81f7"/>
    <text x="420" y="111" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Data</text>
    <text x="540" y="111" fill="#8b949e" font-size="12">← app hands down raw data</text>
    <line x1="420" y1="126" x2="420" y2="156" stroke="#8b949e" stroke-width="2" marker-end="url(#oarr)"/>
  </g>

  <!-- Stage B: segment -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.22;0.26;0.44;0.48" dur="16s" repeatCount="indefinite"/>
    <rect x="340" y="164" width="100" height="40" rx="6" fill="#d29922" opacity="0.3" stroke="#d29922"/>
    <text x="390" y="189" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">TCP hdr</text>
    <rect x="440" y="164" width="120" height="40" rx="6" fill="#2f81f7" opacity="0.25" stroke="#2f81f7"/>
    <text x="500" y="189" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Data</text>
    <text x="620" y="189" fill="#3fb950" font-size="13" font-weight="700">Segment</text>
    <line x1="450" y1="204" x2="450" y2="234" stroke="#8b949e" stroke-width="2" marker-end="url(#oarr)"/>
  </g>

  <!-- Stage C: packet -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.46;0.50;0.68;0.72" dur="16s" repeatCount="indefinite"/>
    <rect x="330" y="242" width="80" height="40" rx="6" fill="#f85149" opacity="0.3" stroke="#f85149"/>
    <text x="370" y="267" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">IP hdr</text>
    <rect x="410" y="242" width="100" height="40" rx="6" fill="#d29922" opacity="0.3" stroke="#d29922"/>
    <text x="460" y="267" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">TCP hdr</text>
    <rect x="510" y="242" width="120" height="40" rx="6" fill="#2f81f7" opacity="0.25" stroke="#2f81f7"/>
    <text x="570" y="267" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Data</text>
    <text x="672" y="267" fill="#3fb950" font-size="13" font-weight="700">Packet</text>
    <line x1="480" y1="282" x2="480" y2="312" stroke="#8b949e" stroke-width="2" marker-end="url(#oarr)"/>
  </g>

  <!-- Stage D: frame -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.70;0.74;0.92;0.96" dur="16s" repeatCount="indefinite"/>
    <rect x="320" y="320" width="70" height="40" rx="6" fill="#a371f7" opacity="0.3" stroke="#a371f7"/>
    <text x="355" y="345" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Eth</text>
    <rect x="390" y="320" width="80" height="40" rx="6" fill="#f85149" opacity="0.3" stroke="#f85149"/>
    <text x="430" y="345" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">IP hdr</text>
    <rect x="470" y="320" width="100" height="40" rx="6" fill="#d29922" opacity="0.3" stroke="#d29922"/>
    <text x="520" y="345" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">TCP hdr</text>
    <rect x="570" y="320" width="100" height="40" rx="6" fill="#2f81f7" opacity="0.25" stroke="#2f81f7"/>
    <text x="620" y="345" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Data</text>
    <rect x="670" y="320" width="56" height="40" rx="6" fill="#a371f7" opacity="0.3" stroke="#a371f7"/>
    <text x="698" y="345" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">FCS</text>
    <text x="523" y="392" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">Frame → serialized as Bits on the wire</text>
    <text x="523" y="414" text-anchor="middle" fill="#8b949e" font-size="11" font-family="monospace">10110010 01101001 11001100 …</text>
  </g>

  <text x="400" y="545" text-anchor="middle" fill="#8b949e" font-size="12">Encapsulation adds headers L7 → L2 · the receiver de-encapsulates in reverse · PDU names: Segment (L4) · Packet (L3) · Frame (L2) · Bits (L1)</text>
</svg>
