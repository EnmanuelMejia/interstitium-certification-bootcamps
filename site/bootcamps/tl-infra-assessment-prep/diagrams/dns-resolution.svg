<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="darr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="darrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#0d1117"/>
  <text x="460" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">DNS Resolution — Recursive Lookup</text>

  <!-- Query path -->
  <path d="M80,320 L240,320 L400,240 L560,160 L720,160" fill="none" stroke="#30363d" stroke-width="3" marker-end="url(#darr)"/>
  <!-- Response path back to client -->
  <path d="M720,210 C600,280 320,380 120,348" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#darrg)"/>

  <!-- Nodes -->
  <g font-size="12" text-anchor="middle">
    <g>
      <circle cx="80" cy="320" r="34" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
      <circle cx="80" cy="320" r="42" fill="none" stroke="#2f81f7" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.03;0.12" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="316" fill="#e6edf3" font-weight="600">Client</text>
      <text x="80" y="333" fill="#8b949e" font-size="10">asks for</text>
      <text x="80" y="380" fill="#58a6ff" font-size="11">www.example.com</text>
    </g>
    <g>
      <circle cx="240" cy="320" r="34" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
      <circle cx="240" cy="320" r="42" fill="none" stroke="#2f81f7" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.18;0.28;0.38" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text x="240" y="316" fill="#e6edf3" font-weight="600">Recursive</text>
      <text x="240" y="333" fill="#8b949e" font-size="10">resolver</text>
    </g>
    <g>
      <circle cx="400" cy="240" r="34" fill="#161b22" stroke="#d29922" stroke-width="2"/>
      <circle cx="400" cy="240" r="42" fill="none" stroke="#d29922" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.4;0.5;0.6" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text x="400" y="236" fill="#e6edf3" font-weight="600">Root</text>
      <text x="400" y="253" fill="#8b949e" font-size="10">( . )</text>
    </g>
    <g>
      <circle cx="560" cy="160" r="34" fill="#161b22" stroke="#d29922" stroke-width="2"/>
      <circle cx="560" cy="160" r="42" fill="none" stroke="#d29922" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.62;0.72;0.82" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text x="560" y="156" fill="#e6edf3" font-weight="600">TLD</text>
      <text x="560" y="173" fill="#8b949e" font-size="10">.com</text>
    </g>
    <g>
      <circle cx="720" cy="160" r="34" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <circle cx="720" cy="160" r="42" fill="none" stroke="#3fb950" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.82;0.92;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text x="720" y="156" fill="#e6edf3" font-weight="600">Authoritative</text>
      <text x="720" y="173" fill="#8b949e" font-size="10">example.com</text>
    </g>
  </g>

  <!-- Query dot traveling the chain -->
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="9s" repeatCount="indefinite" path="M80,320 L240,320 L400,240 L560,160 L720,160"/>
  </circle>
  <!-- Response dot returning -->
  <circle r="6" fill="#3fb950">
    <animateMotion dur="3s" begin="7.5s" repeatCount="indefinite" path="M720,210 C600,280 320,380 120,348"/>
  </circle>

  <!-- Final answer -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.88;0.97;1" dur="9s" repeatCount="indefinite"/>
    <rect x="150" y="352" width="150" height="30" rx="15" fill="#3fb950" opacity="0.15"/>
    <rect x="150" y="352" width="150" height="30" rx="15" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="225" y="372" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">93.184.216.34</text>
  </g>

  <!-- Step labels -->
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="160" y="306">1. query</text>
    <text x="330" y="268">2. referral</text>
    <text x="488" y="188">3. referral</text>
    <text x="646" y="146">4. answer</text>
    <text x="430" y="330" fill="#3fb950">5. cached answer returned to client</text>
  </g>
</svg>
