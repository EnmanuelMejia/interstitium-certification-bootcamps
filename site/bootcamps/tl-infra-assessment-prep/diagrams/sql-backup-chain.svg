<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="sarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f81f7"/>
    </marker>
  </defs>
  <rect width="920" height="440" fill="#0d1117"/>
  <text x="460" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">SQL Server Backup Chain</text>
  <rect x="690" y="44" width="180" height="26" rx="13" fill="#d29922" opacity="0.12"/>
  <rect x="690" y="44" width="180" height="26" rx="13" fill="none" stroke="#d29922" stroke-width="1.5"/>
  <text x="780" y="62" text-anchor="middle" fill="#d29922" font-size="12" font-weight="600">FULL recovery model</text>

  <!-- Timeline -->
  <line x1="60" y1="190" x2="860" y2="190" stroke="#30363d" stroke-width="3"/>
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="100" y="215">Sun</text><text x="220" y="215">Mon</text><text x="340" y="215">Tue</text>
    <text x="460" y="215">Wed</text><text x="580" y="215">Thu</text><text x="700" y="215">Fri</text><text x="820" y="215">Sat</text>
  </g>

  <!-- Full backup (Sun) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    <rect x="64" y="120" width="72" height="62" rx="6" fill="#161b22" stroke="#2f81f7" stroke-width="2.5"/>
    <text x="100" y="147" text-anchor="middle" fill="#2f81f7" font-size="13" font-weight="700">FULL</text>
    <text x="100" y="166" text-anchor="middle" fill="#8b949e" font-size="10">2:00 AM</text>
    <line x1="100" y1="182" x2="100" y2="190" stroke="#2f81f7" stroke-width="2.5"/>
  </g>

  <!-- Log backups Mon/Tue (hourly dots) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="10s" begin="1.0s" repeatCount="indefinite"/>
    <g fill="#58a6ff">
      <circle cx="200" cy="182" r="7"/><circle cx="220" cy="182" r="7"/><circle cx="240" cy="182" r="7"/>
      <circle cx="320" cy="182" r="7"/><circle cx="340" cy="182" r="7"/><circle cx="360" cy="182" r="7"/>
    </g>
    <text x="220" y="160" text-anchor="middle" fill="#58a6ff" font-size="10">log backups</text>
    <text x="340" y="160" text-anchor="middle" fill="#58a6ff" font-size="10">hourly</text>
  </g>

  <!-- Differential (Wed) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="10s" begin="2.0s" repeatCount="indefinite"/>
    <rect x="428" y="126" width="64" height="56" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2.5"/>
    <text x="460" y="150" text-anchor="middle" fill="#d29922" font-size="12" font-weight="700">DIFF</text>
    <text x="460" y="168" text-anchor="middle" fill="#8b949e" font-size="10">2:00 AM</text>
    <line x1="460" y1="182" x2="460" y2="190" stroke="#d29922" stroke-width="2.5"/>
  </g>

  <!-- Log backups Thu/Fri -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="10s" begin="3.0s" repeatCount="indefinite"/>
    <g fill="#58a6ff">
      <circle cx="560" cy="182" r="7"/><circle cx="580" cy="182" r="7"/><circle cx="600" cy="182" r="7"/>
      <circle cx="680" cy="182" r="7"/><circle cx="700" cy="182" r="7"/><circle cx="720" cy="182" r="7"/>
    </g>
    <text x="580" y="160" text-anchor="middle" fill="#58a6ff" font-size="10">log backups</text>
    <text x="700" y="160" text-anchor="middle" fill="#58a6ff" font-size="10">hourly</text>
  </g>

  <!-- Differential (Sat) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="10s" begin="4.0s" repeatCount="indefinite"/>
    <rect x="788" y="126" width="64" height="56" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2.5"/>
    <text x="820" y="150" text-anchor="middle" fill="#d29922" font-size="12" font-weight="700">DIFF</text>
    <text x="820" y="168" text-anchor="middle" fill="#8b949e" font-size="10">2:00 AM</text>
    <line x1="820" y1="182" x2="820" y2="190" stroke="#d29922" stroke-width="2.5"/>
  </g>

  <!-- Restore sequence flow -->
  <text x="460" y="262" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Restore sequence</text>
  <g font-size="12" text-anchor="middle" font-weight="600">
    <rect x="90" y="282" width="170" height="52" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
    <text x="175" y="304" fill="#e6edf3">1 · Restore FULL</text>
    <text x="175" y="322" fill="#8b949e" font-size="10" font-weight="400">WITH NORECOVERY</text>
    <rect x="330" y="282" width="170" height="52" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="415" y="304" fill="#e6edf3">2 · Restore DIFF (Sat)</text>
    <text x="415" y="322" fill="#8b949e" font-size="10" font-weight="400">latest differential</text>
    <rect x="570" y="282" width="260" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="700" y="304" fill="#e6edf3">3 · Replay LOG backups</text>
    <text x="700" y="322" fill="#8b949e" font-size="10" font-weight="400">in order · WITH RECOVERY last</text>
  </g>
  <g>
    <line x1="260" y1="308" x2="330" y2="308" stroke="#2f81f7" stroke-width="2.5" marker-end="url(#sarr)">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="260" y1="308" x2="330" y2="308" stroke="#2f81f7" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>
    <line x1="500" y1="308" x2="570" y2="308" stroke="#2f81f7" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>
  </g>

  <text x="460" y="372" text-anchor="middle" fill="#8b949e" font-size="12">Differential = everything changed since the last FULL · Log chain requires FULL recovery model</text>
  <text x="460" y="394" text-anchor="middle" fill="#8b949e" font-size="12">Break the log chain (e.g. switching to SIMPLE) and point-in-time restore is lost</text>
</svg>
