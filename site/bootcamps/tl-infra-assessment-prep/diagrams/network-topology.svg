<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="460" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">Network Topology — Segmented LAN</text>

  <!-- Router -->
  <rect x="330" y="52" width="140" height="56" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="400" y="76" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Router</text>
  <text x="400" y="96" text-anchor="middle" fill="#8b949e" font-size="12">Edge / Gateway</text>

  <!-- Core switch -->
  <rect x="320" y="152" width="160" height="56" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="400" y="176" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Core Switch</text>
  <text x="400" y="196" text-anchor="middle" fill="#8b949e" font-size="12">Layer 3</text>

  <!-- Access switches -->
  <rect x="120" y="252" width="200" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="220" y="274" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Access Switch A</text>
  <text x="220" y="293" text-anchor="middle" fill="#3fb950" font-size="12">VLAN 10 — Servers</text>

  <rect x="480" y="252" width="200" height="56" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="580" y="274" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Access Switch B</text>
  <text x="580" y="293" text-anchor="middle" fill="#d29922" font-size="12">VLAN 20 — Clients</text>

  <!-- Links -->
  <g stroke="#30363d" stroke-width="3">
    <line x1="400" y1="108" x2="400" y2="152"/>
    <line x1="400" y1="208" x2="220" y2="252"/>
    <line x1="400" y1="208" x2="580" y2="252"/>
    <line x1="140" y1="308" x2="140" y2="336"/>
    <line x1="220" y1="308" x2="220" y2="336"/>
    <line x1="300" y1="308" x2="300" y2="336"/>
    <line x1="500" y1="308" x2="500" y2="336"/>
    <line x1="580" y1="308" x2="580" y2="336"/>
    <line x1="660" y1="308" x2="660" y2="336"/>
  </g>

  <!-- Hosts -->
  <g font-size="11" text-anchor="middle">
    <rect x="102" y="336" width="76" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="140" y="355" fill="#e6edf3">SRV-01</text><text x="140" y="371" fill="#8b949e">10.0.10.11</text>
    <rect x="182" y="336" width="76" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="220" y="355" fill="#e6edf3">SRV-02</text><text x="220" y="371" fill="#8b949e">10.0.10.12</text>
    <rect x="262" y="336" width="76" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="300" y="355" fill="#e6edf3">SRV-03</text><text x="300" y="371" fill="#8b949e">10.0.10.13</text>
    <rect x="462" y="336" width="76" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="500" y="355" fill="#e6edf3">PC-01</text><text x="500" y="371" fill="#8b949e">10.0.20.11</text>
    <rect x="542" y="336" width="76" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="580" y="355" fill="#e6edf3">PC-02</text><text x="580" y="371" fill="#8b949e">10.0.20.12</text>
    <rect x="622" y="336" width="76" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="660" y="355" fill="#e6edf3">PC-03</text><text x="660" y="371" fill="#8b949e">10.0.20.13</text>
  </g>

  <!-- Subnet labels -->
  <text x="220" y="428" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="600">10.0.10.0/24</text>
  <text x="580" y="428" text-anchor="middle" fill="#d29922" font-size="14" font-weight="600">10.0.20.0/24</text>

  <!-- Animated packets -->
  <circle r="5" fill="#58a6ff"><animateMotion dur="1.6s" repeatCount="indefinite" path="M400,108 L400,152"/></circle>
  <circle r="5" fill="#58a6ff"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M400,152 L400,108"/></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="2.4s" repeatCount="indefinite" path="M400,208 L220,252"/></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M220,252 L400,208"/></circle>
  <circle r="5" fill="#d29922"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M400,208 L580,252"/></circle>
  <circle r="5" fill="#d29922"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M580,252 L400,208"/></circle>
  <circle r="4" fill="#3fb950"><animateMotion dur="1.4s" repeatCount="indefinite" path="M220,308 L220,336"/></circle>
  <circle r="4" fill="#3fb950"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M140,336 L140,308"/></circle>
  <circle r="4" fill="#d29922"><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite" path="M580,308 L580,336"/></circle>
  <circle r="4" fill="#d29922"><animateMotion dur="1.4s" begin="1.0s" repeatCount="indefinite" path="M660,336 L660,308"/></circle>
</svg>
