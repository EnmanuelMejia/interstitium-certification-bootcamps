<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="920" height="560" fill="#0d1117"/>
  <text x="460" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">RAID Levels Compared</text>

  <!-- RAID 0 -->
  <g>
    <rect x="10" y="48" width="440" height="238" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="230" y="76" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">RAID 0 — Striping</text>
    <rect x="120" y="90" width="70" height="130" rx="4" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
    <rect x="270" y="90" width="70" height="130" rx="4" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
    <text x="155" y="238" text-anchor="middle" fill="#8b949e" font-size="11">Disk 0</text>
    <text x="305" y="238" text-anchor="middle" fill="#8b949e" font-size="11">Disk 1</text>
    <g font-size="11" text-anchor="middle" font-weight="600">
      <g><rect x="126" y="96" width="58" height="24" rx="3" fill="#2f81f7" opacity="0.7"/><text x="155" y="112" fill="#fff">A1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" begin="0s" repeatCount="indefinite"/></g>
      <g><rect x="276" y="96" width="58" height="24" rx="3" fill="#2f81f7" opacity="0.7"/><text x="305" y="112" fill="#fff">A2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" begin="0.5s" repeatCount="indefinite"/></g>
      <g><rect x="126" y="126" width="58" height="24" rx="3" fill="#2f81f7" opacity="0.7"/><text x="155" y="142" fill="#fff">B1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" begin="1.0s" repeatCount="indefinite"/></g>
      <g><rect x="276" y="126" width="58" height="24" rx="3" fill="#2f81f7" opacity="0.7"/><text x="305" y="142" fill="#fff">B2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" begin="1.5s" repeatCount="indefinite"/></g>
    </g>
    <text x="230" y="266" text-anchor="middle" fill="#8b949e" font-size="12">No redundancy · fastest writes</text>
    <text x="230" y="252" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600" transform="translate(0,18)">Usable: n×d</text>
  </g>

  <!-- RAID 1 -->
  <g>
    <rect x="470" y="48" width="440" height="238" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="690" y="76" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">RAID 1 — Mirroring</text>
    <rect x="580" y="90" width="70" height="130" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="730" y="90" width="70" height="130" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="615" y="238" text-anchor="middle" fill="#8b949e" font-size="11">Disk 0</text>
    <text x="765" y="238" text-anchor="middle" fill="#8b949e" font-size="11">Disk 1 (mirror)</text>
    <g font-size="11" text-anchor="middle" font-weight="600">
      <g><rect x="586" y="96" width="58" height="24" rx="3" fill="#3fb950" opacity="0.7"/><text x="615" y="112" fill="#fff">A1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" begin="0s" repeatCount="indefinite"/></g>
      <g><rect x="736" y="96" width="58" height="24" rx="3" fill="#3fb950" opacity="0.7"/><text x="765" y="112" fill="#fff">A1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" begin="0.4s" repeatCount="indefinite"/></g>
      <g><rect x="586" y="126" width="58" height="24" rx="3" fill="#3fb950" opacity="0.7"/><text x="615" y="142" fill="#fff">A2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" begin="1.0s" repeatCount="indefinite"/></g>
      <g><rect x="736" y="126" width="58" height="24" rx="3" fill="#3fb950" opacity="0.7"/><text x="765" y="142" fill="#fff">A2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="5s" begin="1.4s" repeatCount="indefinite"/></g>
    </g>
    <text x="690" y="266" text-anchor="middle" fill="#8b949e" font-size="12">Survives 1 disk failure</text>
    <text x="690" y="270" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Usable: n/2</text>
  </g>

  <!-- RAID 5 -->
  <g>
    <rect x="10" y="300" width="440" height="238" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="230" y="328" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">RAID 5 — Striping + Parity</text>
    <rect x="90" y="342" width="70" height="130" rx="4" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect x="195" y="342" width="70" height="130" rx="4" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect x="300" y="342" width="70" height="130" rx="4" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="125" y="490" text-anchor="middle" fill="#8b949e" font-size="11">Disk 0</text>
    <text x="230" y="490" text-anchor="middle" fill="#8b949e" font-size="11">Disk 1</text>
    <text x="335" y="490" text-anchor="middle" fill="#8b949e" font-size="11">Disk 2</text>
    <g font-size="11" text-anchor="middle" font-weight="600">
      <g><rect x="96" y="348" width="58" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="125" y="363" fill="#fff">A1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="0s" repeatCount="indefinite"/></g>
      <g><rect x="201" y="348" width="58" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="230" y="363" fill="#fff">A2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="0.3s" repeatCount="indefinite"/></g>
      <g><rect x="306" y="348" width="58" height="22" rx="3" fill="#d29922" opacity="0.85"/><text x="335" y="363" fill="#0d1117">P</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="0.6s" repeatCount="indefinite"/></g>
      <g><rect x="96" y="376" width="58" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="125" y="391" fill="#fff">B1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></g>
      <g><rect x="201" y="376" width="58" height="22" rx="3" fill="#d29922" opacity="0.85"/><text x="230" y="391" fill="#0d1117">P</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></g>
      <g><rect x="306" y="376" width="58" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="335" y="391" fill="#fff">B2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></g>
      <g><rect x="96" y="404" width="58" height="22" rx="3" fill="#d29922" opacity="0.85"/><text x="125" y="419" fill="#0d1117">P</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="2.4s" repeatCount="indefinite"/></g>
      <g><rect x="201" y="404" width="58" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="230" y="419" fill="#fff">C1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="2.7s" repeatCount="indefinite"/></g>
      <g><rect x="306" y="404" width="58" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="335" y="419" fill="#fff">C2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="3.0s" repeatCount="indefinite"/></g>
    </g>
    <text x="230" y="518" text-anchor="middle" fill="#8b949e" font-size="12">Parity rotates · survives 1 disk failure</text>
    <text x="230" y="522" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Usable: (n−1)×d</text>
  </g>

  <!-- RAID 10 -->
  <g>
    <rect x="470" y="300" width="440" height="238" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="690" y="328" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">RAID 10 — Mirrored Stripes</text>
    <rect x="540" y="342" width="60" height="130" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="620" y="342" width="60" height="130" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="720" y="342" width="60" height="130" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="800" y="342" width="60" height="130" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="690" y="360" text-anchor="middle" fill="#8b949e" font-size="11">Pair 1 (mirror)</text>
    <text x="610" y="490" text-anchor="middle" fill="#8b949e" font-size="11">0 · 1</text>
    <text x="810" y="490" text-anchor="middle" fill="#8b949e" font-size="11">2 · 3</text>
    <g font-size="11" text-anchor="middle" font-weight="600">
      <g><rect x="545" y="372" width="50" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="570" y="387" fill="#fff">A1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="0s" repeatCount="indefinite"/></g>
      <g><rect x="625" y="372" width="50" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="650" y="387" fill="#fff">A1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="0.3s" repeatCount="indefinite"/></g>
      <g><rect x="725" y="372" width="50" height="22" rx="3" fill="#58a6ff" opacity="0.7"/><text x="750" y="387" fill="#fff">B1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="0.9s" repeatCount="indefinite"/></g>
      <g><rect x="805" y="372" width="50" height="22" rx="3" fill="#58a6ff" opacity="0.7"/><text x="830" y="387" fill="#fff">B1</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></g>
      <g><rect x="545" y="400" width="50" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="570" y="415" fill="#fff">A2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></g>
      <g><rect x="625" y="400" width="50" height="22" rx="3" fill="#2f81f7" opacity="0.7"/><text x="650" y="415" fill="#fff">A2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="2.1s" repeatCount="indefinite"/></g>
      <g><rect x="725" y="400" width="50" height="22" rx="3" fill="#58a6ff" opacity="0.7"/><text x="750" y="415" fill="#fff">B2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="2.7s" repeatCount="indefinite"/></g>
      <g><rect x="805" y="400" width="50" height="22" rx="3" fill="#58a6ff" opacity="0.7"/><text x="830" y="415" fill="#fff">B2</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.85;1" dur="6s" begin="3.0s" repeatCount="indefinite"/></g>
    </g>
    <text x="690" y="518" text-anchor="middle" fill="#8b949e" font-size="12">Striped across mirror pairs · fast + safe</text>
    <text x="690" y="522" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Usable: (n/2)×d</text>
  </g>
</svg>
