<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="920" height="500" fill="#0d1117"/>
  <text x="460" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">Active Directory OU Hierarchy</text>

  <!-- Level 0: root domain -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.9;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    <rect x="385" y="52" width="150" height="52" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
    <text x="460" y="75" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">corp.local</text>
    <text x="460" y="94" text-anchor="middle" fill="#8b949e" font-size="11">Root domain</text>
  </g>

  <!-- Level 1 connectors + OUs -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.9;1" dur="8s" begin="0.8s" repeatCount="indefinite"/>
    <g stroke="#30363d" stroke-width="2">
      <line x1="460" y1="104" x2="460" y2="128"/>
      <line x1="150" y1="128" x2="770" y2="128"/>
      <line x1="150" y1="128" x2="150" y2="152"/>
      <line x1="350" y1="128" x2="350" y2="152"/>
      <line x1="570" y1="128" x2="570" y2="152"/>
      <line x1="770" y1="128" x2="770" y2="152"/>
    </g>
    <g font-size="14" text-anchor="middle">
      <rect x="75" y="152" width="150" height="54" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="150" y="176" fill="#e6edf3" font-weight="600">Workstations</text>
      <text x="150" y="195" fill="#8b949e" font-size="11">OU</text>
      <rect x="275" y="152" width="150" height="54" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="350" y="176" fill="#e6edf3" font-weight="600">Servers</text>
      <text x="350" y="195" fill="#8b949e" font-size="11">OU</text>
      <rect x="495" y="152" width="150" height="54" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="570" y="176" fill="#e6edf3" font-weight="600">Users</text>
      <text x="570" y="195" fill="#8b949e" font-size="11">OU</text>
      <rect x="695" y="152" width="150" height="54" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="770" y="176" fill="#e6edf3" font-weight="600">ServiceAccounts</text>
      <text x="770" y="195" fill="#8b949e" font-size="11">OU</text>
    </g>
  </g>

  <!-- Level 2 connectors + sub-OUs -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.9;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
    <g stroke="#30363d" stroke-width="2">
      <line x1="150" y1="206" x2="150" y2="232"/><line x1="90" y1="232" x2="210" y2="232"/>
      <line x1="90" y1="232" x2="90" y2="258"/><line x1="210" y1="232" x2="210" y2="258"/>
      <line x1="350" y1="206" x2="350" y2="232"/><line x1="290" y1="232" x2="410" y2="232"/>
      <line x1="290" y1="232" x2="290" y2="258"/><line x1="410" y1="232" x2="410" y2="258"/>
      <line x1="570" y1="206" x2="570" y2="232"/><line x1="510" y1="232" x2="630" y2="232"/>
      <line x1="510" y1="232" x2="510" y2="258"/><line x1="630" y1="232" x2="630" y2="258"/>
      <line x1="770" y1="206" x2="770" y2="232"/><line x1="710" y1="232" x2="830" y2="232"/>
      <line x1="710" y1="232" x2="710" y2="258"/><line x1="830" y1="232" x2="830" y2="258"/>
    </g>
    <g font-size="12" text-anchor="middle">
      <rect x="30" y="258" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="90" y="285" fill="#e6edf3">Laptops</text>
      <rect x="150" y="258" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="210" y="285" fill="#e6edf3">Desktops</text>
      <rect x="230" y="258" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="290" y="285" fill="#e6edf3">Web</text>
      <rect x="350" y="258" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="410" y="285" fill="#e6edf3">DB</text>
      <rect x="450" y="258" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="510" y="285" fill="#e6edf3">Sales</text>
      <rect x="570" y="258" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="630" y="285" fill="#e6edf3">IT</text>
      <rect x="650" y="258" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="710" y="285" fill="#e6edf3">Backup</text>
      <rect x="770" y="258" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="830" y="285" fill="#e6edf3">Monitoring</text>
    </g>
  </g>

  <!-- GPO badge -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.9;1" dur="8s" begin="2.4s" repeatCount="indefinite"/>
    <rect x="425" y="122" width="118" height="24" rx="12" fill="#3fb950" opacity="0.15"/>
    <rect x="425" y="122" width="118" height="24" rx="12" fill="none" stroke="#3fb950" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="484" y="139" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">GPO linked here</text>
    <line x1="484" y1="146" x2="420" y2="152" stroke="#3fb950" stroke-width="1.5"/>
  </g>

  <!-- Legend -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.9;1" dur="8s" begin="3.2s" repeatCount="indefinite"/>
    <text x="460" y="360" text-anchor="middle" fill="#8b949e" font-size="13">Policies flow down the tree · child OUs inherit parent GPOs unless blocked</text>
    <text x="460" y="386" text-anchor="middle" fill="#8b949e" font-size="13">Order of application: Local → Site → Domain → OU (LSDOU)</text>
  </g>
</svg>
