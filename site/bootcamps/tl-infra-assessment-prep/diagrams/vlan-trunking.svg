<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="800" height="460" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">802.1Q VLAN Trunking</text>

  <!-- Left host + access port -->
  <circle cx="60" cy="240" r="18" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="60" y="245" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">PC</text>
  <text x="60" y="278" text-anchor="middle" fill="#e6edf3" font-size="12">PC-A · VLAN 20</text>
  <line x1="78" y1="240" x2="160" y2="240" stroke="#3fb950" stroke-width="3"/>
  <text x="119" y="262" text-anchor="middle" fill="#3fb950" font-size="11">Access port (untagged)</text>

  <!-- Switch A -->
  <rect x="160" y="200" width="150" height="80" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="235" y="234" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Switch A</text>
  <text x="235" y="256" text-anchor="middle" fill="#8b949e" font-size="11">VLANs 10, 20</text>

  <!-- Trunk -->
  <line x1="310" y1="240" x2="490" y2="240" stroke="#d29922" stroke-width="4"/>
  <text x="400" y="222" text-anchor="middle" fill="#d29922" font-size="13" font-weight="600">Trunk (tagged)</text>
  <rect x="352" y="186" width="44" height="18" rx="9" fill="#161b22" stroke="#2f81f7" stroke-width="1"/>
  <text x="374" y="199" text-anchor="middle" fill="#2f81f7" font-size="10">VLAN 10</text>
  <rect x="404" y="186" width="44" height="18" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="426" y="199" text-anchor="middle" fill="#3fb950" font-size="10">VLAN 20</text>

  <!-- Switch B -->
  <rect x="490" y="200" width="150" height="80" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="565" y="234" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Switch B</text>
  <text x="565" y="256" text-anchor="middle" fill="#8b949e" font-size="11">VLANs 10, 20</text>

  <!-- Right host + access port -->
  <line x1="640" y1="240" x2="722" y2="240" stroke="#3fb950" stroke-width="3"/>
  <text x="681" y="262" text-anchor="middle" fill="#3fb950" font-size="11">Access port (untagged)</text>
  <circle cx="740" cy="240" r="18" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="740" y="245" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">PC</text>
  <text x="740" y="278" text-anchor="middle" fill="#e6edf3" font-size="12">PC-B · VLAN 20</text>

  <!-- VLAN 10 hosts (second access pair) -->
  <circle cx="235" cy="330" r="14" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="235" y="334" text-anchor="middle" fill="#2f81f7" font-size="10" font-weight="600">S</text>
  <line x1="235" y1="280" x2="235" y2="316" stroke="#2f81f7" stroke-width="3"/>
  <text x="235" y="362" text-anchor="middle" fill="#e6edf3" font-size="11">SRV · VLAN 10</text>
  <circle cx="565" cy="330" r="14" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="565" y="334" text-anchor="middle" fill="#2f81f7" font-size="10" font-weight="600">S</text>
  <line x1="565" y1="280" x2="565" y2="316" stroke="#2f81f7" stroke-width="3"/>
  <text x="565" y="362" text-anchor="middle" fill="#e6edf3" font-size="11">SRV · VLAN 10</text>

  <!-- Animated VLAN 20 frame (green tag) -->
  <g>
    <animateMotion dur="5s" repeatCount="indefinite" path="M175,240 L625,240"/>
    <rect x="-58" y="-17" width="116" height="34" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="-58" y="-17" width="40" height="34" fill="#30363d"/>
    <rect x="18" y="-17" width="40" height="34" fill="#2f81f7" opacity="0.55"/>
    <rect x="-18" y="-17" width="0" height="34" fill="#3fb950" opacity="0.85">
      <animate attributeName="width" values="0;0;36;36;0" keyTimes="0;0.25;0.42;0.78;0.95" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-26" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600" opacity="0">802.1Q · VLAN 20
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.42;0.78;0.95" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Animated VLAN 10 frame (blue tag), offset half cycle -->
  <g>
    <animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite" path="M175,240 L625,240"/>
    <rect x="-58" y="-17" width="116" height="34" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="-58" y="-17" width="40" height="34" fill="#30363d"/>
    <rect x="18" y="-17" width="40" height="34" fill="#2f81f7" opacity="0.55"/>
    <rect x="-18" y="-17" width="0" height="34" fill="#2f81f7" opacity="0.85">
      <animate attributeName="width" values="0;0;36;36;0" keyTimes="0;0.25;0.42;0.78;0.95" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-26" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="600" opacity="0">802.1Q · VLAN 10
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.42;0.78;0.95" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Tag anatomy callout -->
  <g>
    <rect x="300" y="392" width="200" height="46" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="400" y="411" text-anchor="middle" fill="#d29922" font-size="12" font-weight="600">802.1Q tag = 4 bytes</text>
    <text x="400" y="429" text-anchor="middle" fill="#8b949e" font-size="11">TPID 0x8100 · VLAN ID</text>
  </g>
</svg>
