<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="990" height="440" fill="#0d1117"/>
  <text x="495" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">Hyper-V Virtual Switch Types</text>

  <!-- ============ EXTERNAL ============ -->
  <g>
    <rect x="10" y="48" width="310" height="380" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="165" y="76" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">External</text>
    <text x="165" y="94" text-anchor="middle" fill="#8b949e" font-size="11">Bound to a physical NIC</text>

    <text x="165" y="122" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">Physical network</text>
    <rect x="115" y="130" width="100" height="38" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="165" y="154" text-anchor="middle" fill="#e6edf3" font-size="12">Physical NIC</text>

    <rect x="75" y="196" width="180" height="56" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
    <text x="165" y="220" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">vSwitch</text>
    <text x="165" y="240" text-anchor="middle" fill="#8b949e" font-size="11">virtual switch</text>

    <rect x="30" y="286" width="100" height="48" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="80" y="306" text-anchor="middle" fill="#e6edf3" font-size="12">Host OS</text>
    <text x="80" y="324" text-anchor="middle" fill="#8b949e" font-size="10">vNIC</text>
    <rect x="150" y="286" width="100" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="200" y="306" text-anchor="middle" fill="#e6edf3" font-size="12">VM 1</text>
    <text x="200" y="324" text-anchor="middle" fill="#8b949e" font-size="10">vNIC</text>
    <rect x="90" y="352" width="100" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="140" y="372" text-anchor="middle" fill="#e6edf3" font-size="12">VM 2</text>
    <text x="140" y="390" text-anchor="middle" fill="#8b949e" font-size="10">vNIC</text>

    <g stroke="#30363d" stroke-width="2.5">
      <line x1="165" y1="168" x2="165" y2="196"/>
      <line x1="80" y1="252" x2="80" y2="286"/>
      <line x1="200" y1="252" x2="200" y2="286"/>
      <line x1="140" y1="252" x2="140" y2="352"/>
    </g>
    <!-- packets: VM -> vSwitch -> physical network -->
    <circle r="5" fill="#3fb950"><animateMotion dur="2.6s" repeatCount="indefinite" path="M200,286 L200,252 L165,224 L165,168 L165,130"/></circle>
    <circle r="5" fill="#3fb950"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M165,130 L165,168 L165,224 L140,300 L140,352"/></circle>
    <circle r="5" fill="#d29922"><animateMotion dur="3.2s" begin="0.5s" repeatCount="indefinite" path="M80,286 L80,252 L165,224 L200,260 L200,286"/></circle>
  </g>

  <!-- ============ INTERNAL ============ -->
  <g>
    <rect x="340" y="48" width="310" height="380" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="495" y="76" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Internal</text>
    <text x="495" y="94" text-anchor="middle" fill="#8b949e" font-size="11">Host + VMs only · no physical NIC</text>

    <text x="495" y="122" text-anchor="middle" fill="#8b949e" font-size="12">Physical network</text>
    <line x1="495" y1="130" x2="495" y2="196" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="520" y="168" text-anchor="middle" fill="#f85149" font-size="22" font-weight="700">✗</text>

    <rect x="405" y="196" width="180" height="56" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
    <text x="495" y="220" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">vSwitch</text>
    <text x="495" y="240" text-anchor="middle" fill="#8b949e" font-size="11">virtual switch</text>

    <rect x="360" y="286" width="100" height="48" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="410" y="306" text-anchor="middle" fill="#e6edf3" font-size="12">Host OS</text>
    <text x="410" y="324" text-anchor="middle" fill="#8b949e" font-size="10">vNIC</text>
    <rect x="480" y="286" width="100" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="530" y="306" text-anchor="middle" fill="#e6edf3" font-size="12">VM 1</text>
    <text x="530" y="324" text-anchor="middle" fill="#8b949e" font-size="10">vNIC</text>

    <g stroke="#30363d" stroke-width="2.5">
      <line x1="410" y1="252" x2="410" y2="286"/>
      <line x1="530" y1="252" x2="530" y2="286"/>
    </g>
    <!-- packets loop host <-> VM only -->
    <circle r="5" fill="#d29922"><animateMotion dur="2.0s" repeatCount="indefinite" path="M410,286 L410,252 L495,224 L530,252 L530,286"/></circle>
    <circle r="5" fill="#58a6ff"><animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite" path="M530,286 L530,252 L495,224 L410,252 L410,286"/></circle>
    <text x="495" y="372" text-anchor="middle" fill="#8b949e" font-size="11">Host can talk to VMs</text>
    <text x="495" y="390" text-anchor="middle" fill="#8b949e" font-size="11">No path to the physical LAN</text>
  </g>

  <!-- ============ PRIVATE ============ -->
  <g>
    <rect x="670" y="48" width="310" height="380" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="825" y="76" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Private</text>
    <text x="825" y="94" text-anchor="middle" fill="#8b949e" font-size="11">VMs only · fully isolated</text>

    <text x="825" y="122" text-anchor="middle" fill="#8b949e" font-size="12">Physical network</text>
    <line x1="825" y1="130" x2="825" y2="168" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="850" y="156" text-anchor="middle" fill="#f85149" font-size="22" font-weight="700">✗</text>
    <text x="825" y="146" text-anchor="middle" fill="#8b949e" font-size="12">Host OS</text>
    <line x1="740" y1="150" x2="740" y2="196" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="715" y="182" text-anchor="middle" fill="#f85149" font-size="22" font-weight="700">✗</text>

    <rect x="735" y="196" width="180" height="56" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
    <text x="825" y="220" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">vSwitch</text>
    <text x="825" y="240" text-anchor="middle" fill="#8b949e" font-size="11">virtual switch</text>

    <rect x="690" y="286" width="100" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="740" y="306" text-anchor="middle" fill="#e6edf3" font-size="12">VM 1</text>
    <text x="740" y="324" text-anchor="middle" fill="#8b949e" font-size="10">vNIC</text>
    <rect x="810" y="286" width="100" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="860" y="306" text-anchor="middle" fill="#e6edf3" font-size="12">VM 2</text>
    <text x="860" y="324" text-anchor="middle" fill="#8b949e" font-size="10">vNIC</text>

    <g stroke="#30363d" stroke-width="2.5">
      <line x1="740" y1="252" x2="740" y2="286"/>
      <line x1="860" y1="252" x2="860" y2="286"/>
    </g>
    <!-- packets loop VM <-> VM only -->
    <circle r="5" fill="#58a6ff"><animateMotion dur="2.0s" repeatCount="indefinite" path="M740,286 L740,252 L825,224 L860,252 L860,286"/></circle>
    <circle r="5" fill="#58a6ff"><animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite" path="M860,286 L860,252 L825,224 L740,252 L740,286"/></circle>
    <text x="825" y="372" text-anchor="middle" fill="#8b949e" font-size="11">VMs talk to each other</text>
    <text x="825" y="390" text-anchor="middle" fill="#8b949e" font-size="11">Host + physical LAN unreachable</text>
  </g>
</svg>
