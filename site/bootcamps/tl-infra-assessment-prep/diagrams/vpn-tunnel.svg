<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="varr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d29922"/>
    </marker>
    <marker id="varr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">Site-to-Site VPN Tunnel</text>

  <!-- Site routers -->
  <rect x="60" y="200" width="120" height="60" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="120" y="226" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">RTR-A</text>
  <text x="120" y="246" text-anchor="middle" fill="#8b949e" font-size="11">Site A</text>
  <text x="120" y="282" text-anchor="middle" fill="#3fb950" font-size="12">10.1.0.0/24</text>

  <rect x="620" y="200" width="120" height="60" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="680" y="226" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">RTR-B</text>
  <text x="680" y="246" text-anchor="middle" fill="#8b949e" font-size="11">Site B</text>
  <text x="680" y="282" text-anchor="middle" fill="#3fb950" font-size="12">10.2.0.0/24</text>

  <!-- Internet cloud -->
  <ellipse cx="400" cy="230" rx="170" ry="72" fill="#161b22" stroke="#8b949e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="400" y="236" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600">Public Internet</text>

  <!-- Encrypted tunnel (appears after Phase 2) -->
  <path d="M180,230 C280,150 520,150 620,230" fill="none" stroke="#2f81f7" stroke-width="4" stroke-dasharray="10 6" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.95;1" dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- IKE Phase 1 arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.3;0.36" dur="14s" repeatCount="indefinite"/>
    <path d="M190,180 C290,120 510,120 610,180" fill="none" stroke="#d29922" stroke-width="2.5" marker-end="url(#varr)"/>
    <path d="M610,150 C510,90 290,90 190,150" fill="none" stroke="#d29922" stroke-width="2.5" marker-end="url(#varr)"/>
    <text x="400" y="86" text-anchor="middle" fill="#d29922" font-size="13" font-weight="600">IKE Phase 1 — UDP 500</text>
    <text x="400" y="104" text-anchor="middle" fill="#8b949e" font-size="11">Peer authentication · key exchange (ISAKMP SA)</text>
  </g>

  <!-- IKE Phase 2 arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.34;0.4;0.58;0.64" dur="14s" repeatCount="indefinite"/>
    <path d="M190,320 C290,380 510,380 610,320" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#varr2)"/>
    <path d="M610,350 C510,410 290,410 190,350" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#varr2)"/>
    <text x="400" y="424" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">IKE Phase 2 — UDP 4500 NAT-T</text>
    <text x="400" y="442" text-anchor="middle" fill="#8b949e" font-size="11">Negotiates the IPSec SA · ESP encrypts the traffic</text>
  </g>

  <!-- Lock: tunnel established -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.68;0.95;1" dur="14s" repeatCount="indefinite"/>
    <rect x="386" y="140" width="28" height="24" rx="4" fill="#3fb950"/>
    <path d="M392,140 v-6 a8,8 0 0 1 16,0 v6" fill="none" stroke="#3fb950" stroke-width="4"/>
    <circle cx="400" cy="152" r="4" fill="#0d1117"/>
    <text x="400" y="182" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">Tunnel established</text>
  </g>

  <!-- Encrypted packet dots flowing through tunnel -->
  <circle r="6" fill="#3fb950">
    <animateMotion dur="2.4s" begin="8.4s" repeatCount="indefinite" path="M180,230 C280,150 520,150 620,230"/>
  </circle>
  <circle r="6" fill="#3fb950">
    <animateMotion dur="2.4s" begin="9.2s" repeatCount="indefinite" path="M180,230 C280,150 520,150 620,230"/>
  </circle>
  <circle r="6" fill="#3fb950">
    <animateMotion dur="2.4s" begin="10.0s" repeatCount="indefinite" path="M180,230 C280,150 520,150 620,230"/>
  </circle>
  <circle r="6" fill="#3fb950">
    <animateMotion dur="2.4s" begin="8.8s" repeatCount="indefinite" path="M620,230 C520,150 280,150 180,230"/>
  </circle>

  <!-- Phase legend -->
  <g font-size="11" fill="#8b949e">
    <circle cx="40" cy="400" r="5" fill="#d29922"/><text x="52" y="404">Phase 1: authenticate + keys</text>
    <circle cx="240" cy="400" r="5" fill="#58a6ff"/><text x="252" y="404">Phase 2: IPSec SA + ESP</text>
    <circle cx="440" cy="400" r="5" fill="#3fb950"/><text x="452" y="404">Encrypted traffic</text>
  </g>
</svg>
