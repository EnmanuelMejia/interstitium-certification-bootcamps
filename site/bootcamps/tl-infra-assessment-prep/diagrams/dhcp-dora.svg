<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="harr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="harrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#0d1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">DHCP DORA — Four-Step Lease Process</text>

  <!-- Client -->
  <rect x="60" y="190" width="140" height="70" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="130" y="216" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Client</text>
  <text x="130" y="236" text-anchor="middle" fill="#8b949e" font-size="11">no IP yet</text>

  <!-- Server -->
  <rect x="600" y="190" width="140" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="670" y="216" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">DHCP Server</text>
  <text x="670" y="236" text-anchor="middle" fill="#8b949e" font-size="11">192.168.1.1</text>

  <!-- 1. DISCOVER -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.22;0.27" dur="12s" repeatCount="indefinite"/>
    <line x1="200" y1="170" x2="600" y2="170" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#harr)"/>
    <text x="400" y="156" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">1 · DHCPDISCOVER (broadcast)</text>
    <text x="400" y="190" text-anchor="middle" fill="#8b949e" font-size="11">"Anyone out there? I need an IP."</text>
  </g>

  <!-- 2. OFFER -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.24;0.27;0.46;0.51" dur="12s" repeatCount="indefinite"/>
    <line x1="600" y1="215" x2="200" y2="215" stroke="#3fb950" stroke-width="2.5" marker-end="url(#harrg)"/>
    <text x="400" y="201" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">2 · DHCPOFFER — 192.168.1.50</text>
    <text x="400" y="235" text-anchor="middle" fill="#8b949e" font-size="11">"You can have 192.168.1.50."</text>
  </g>

  <!-- 3. REQUEST -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.48;0.51;0.70;0.75" dur="12s" repeatCount="indefinite"/>
    <line x1="200" y1="260" x2="600" y2="260" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#harr)"/>
    <text x="400" y="246" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">3 · DHCPREQUEST (broadcast)</text>
    <text x="400" y="280" text-anchor="middle" fill="#8b949e" font-size="11">"I'll take 192.168.1.50."</text>
  </g>

  <!-- 4. ACK -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.72;0.75;0.92;0.97" dur="12s" repeatCount="indefinite"/>
    <line x1="600" y1="305" x2="200" y2="305" stroke="#3fb950" stroke-width="2.5" marker-end="url(#harrg)"/>
    <text x="400" y="291" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">4 · DHCPACK</text>
    <text x="400" y="325" text-anchor="middle" fill="#8b949e" font-size="11">"Confirmed — it's yours."</text>
  </g>

  <!-- Lease granted -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.85;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="260" y="352" width="280" height="44" rx="22" fill="#3fb950" opacity="0.12"/>
    <rect x="260" y="352" width="280" height="44" rx="22" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="400" y="379" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="600">✓ Lease: 8 days — 192.168.1.50</text>
  </g>

  <!-- Mnemonic footer -->
  <text x="400" y="428" text-anchor="middle" fill="#8b949e" font-size="12">DORA = Discover · Offer · Request · Acknowledge — UDP ports 67 (server) / 68 (client)</text>
</svg>
