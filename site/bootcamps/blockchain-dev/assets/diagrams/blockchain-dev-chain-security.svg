<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Smart Contract Security</title><desc>Key ideas: Reentrancy; Access control; Oracles; Key management; Audits</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Smart Contract Security</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Code is law — audit like it.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="119" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="66" cy="133" r="13" fill="#3ddc97"/><text x="66" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="86" y="137" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Reentrancy</text><text x="86" y="157" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Guard external calls.</text><rect x="408" y="107" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="119" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="438" cy="133" r="13" fill="#3ddc97"/><text x="438" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="458" y="137" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Access control</text><text x="458" y="157" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Ownable / roles on sensitive fns.</text><rect x="36" y="227" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="239" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="66" cy="253" r="13" fill="#3ddc97"/><text x="66" y="258" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="86" y="257" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Oracles</text><text x="86" y="277" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Trust-minimized price feeds.</text><rect x="408" y="227" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="239" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="438" cy="253" r="13" fill="#3ddc97"/><text x="438" y="258" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="458" y="257" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Key management</text><text x="458" y="277" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Multisig for admin keys.</text><rect x="36" y="347" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="359" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="66" cy="373" r="13" fill="#3ddc97"/><text x="66" y="378" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">5</text><text x="86" y="377" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Audits</text><text x="86" y="397" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Independent review before mainnet.</text></svg>