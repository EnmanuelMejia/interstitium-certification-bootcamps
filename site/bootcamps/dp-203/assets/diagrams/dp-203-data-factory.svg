<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Data Factory</title><desc>Key ideas: Linked services encapsulate connection information (server, auth via managed identity/Key…; Integration runtimes; SSIS IR; Lift-and-shift ETL</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Data Factory</text><rect x="36" y="70" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="90" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="102" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="116" r="13" fill="#3ddc97"/><text x="66" y="121" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="86" y="120" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Linked services encapsulate</text><text x="86" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">linked services and datasets take parameters</text><text x="86" y="156" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">resolved at runtime or deploy time.</text><rect x="408" y="90" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="102" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="116" r="13" fill="#3ddc97"/><text x="438" y="121" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="458" y="120" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Integration runtimes</text><text x="458" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">the self-hosted integration runtime runs</text><text x="458" y="156" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">inside your network and initiates outbound</text><text x="458" y="172" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">connections to Data Factory — no inbound</text><rect x="36" y="220" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="232" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="246" r="13" fill="#3ddc97"/><text x="66" y="251" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="86" y="250" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">SSIS IR</text><text x="86" y="270" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">azure IR handles cloud sources; SSIS IR</text><text x="86" y="286" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">lifts SSIS packages. The SSIS IR provisions</text><text x="86" y="302" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">the SSIS engine in ADF so existing packages</text><rect x="408" y="220" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="232" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="246" r="13" fill="#3ddc97"/><text x="438" y="251" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="458" y="250" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Lift-and-shift ETL</text><text x="458" y="270" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">mapping data flows give a visual designer</text><text x="458" y="286" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">for joins, aggregations, window functions,</text><text x="458" y="302" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">and schema handling, executed on ADF-managed</text></svg>