<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Security</title><desc>Key ideas: Managed identity; Private endpoints; Data network security; CMK moves key control (creation, rotation, revocation) to your Key Vault while the servic…</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Security</text><rect x="36" y="70" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="90" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="102" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="116" r="13" fill="#3ddc97"/><text x="66" y="121" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="86" y="120" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Managed identity</text><text x="86" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">aDF's system-assigned managed identity</text><text x="86" y="156" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">authenticates to Azure data stores via RBAC</text><text x="86" y="172" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">— no credentials to rotate, expire, or leak.</text><rect x="408" y="90" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="102" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="116" r="13" fill="#3ddc97"/><text x="438" y="121" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="458" y="120" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Private endpoints</text><text x="458" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">data-plane privacy needs private endpoints</text><text x="458" y="156" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">(lake traffic stays in the VNet) plus</text><text x="458" y="172" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">public-access disabled at the account level.</text><rect x="36" y="220" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="232" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="246" r="13" fill="#3ddc97"/><text x="66" y="251" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="86" y="250" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Data network security</text><text x="86" y="270" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">revoking the key renders the data unreadable</text><text x="86" y="286" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">— the contractual 'we control the keys'</text><text x="86" y="302" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">proof. Purview's scanners classify sensitive</text><rect x="408" y="220" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="232" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="246" r="13" fill="#3ddc97"/><text x="438" y="251" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="458" y="250" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">CMK moves key control</text><text x="458" y="270" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">still performs encryption.</text></svg>