<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Data Storage Design</title><desc>Key ideas: ADLS Gen2's hierarchical namespace brings true directories with atomic renames; Parquet's columnar layout means queries read only needed columns (massive scan reduction); Partitioning organizes data so the engine prunes (skips) partitions outside the filter</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Data Storage Design</text><rect x="36" y="70" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="90" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="102" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="116" r="13" fill="#3ddc97"/><text x="66" y="121" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="86" y="120" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">ADLS Gen2's hierarchical</text><text x="86" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">which Spark and Hadoop rely on for commit</text><text x="86" y="156" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">protocols.</text><rect x="408" y="90" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="102" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="438" cy="116" r="13" fill="#3ddc97"/><text x="438" y="121" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="458" y="120" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Parquet's columnar layout</text><text x="458" y="140" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Delta Lake adds ACID transactions, schema</text><text x="458" y="156" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">enforcement, and time travel on top.</text><rect x="36" y="220" width="356" height="118" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="232" width="4" height="94" rx="2" fill="#3ddc97"/><circle cx="66" cy="246" r="13" fill="#3ddc97"/><text x="66" y="251" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="86" y="250" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">Partitioning organizes data so</text><text x="86" y="270" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">a month query reads 1/60th of 5 years.</text></svg>