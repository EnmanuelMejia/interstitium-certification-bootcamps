<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>NICE Framework Structure</title><desc>Key ideas: SP · Securely Provision; OM · Operate &amp; Maintain; OV · Oversee &amp; Govern; PR · Protect &amp; Defend; AN · Analyze; CO · Collect &amp; Operate</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">NICE Framework Structure</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">Categories → specialty areas → work roles.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><rect x="36" y="107" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="119" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="66" cy="133" r="13" fill="#3ddc97"/><text x="66" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">1</text><text x="86" y="137" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">SP · Securely Provision</text><text x="86" y="157" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Design and build secure systems.</text><rect x="408" y="107" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="119" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="438" cy="133" r="13" fill="#3ddc97"/><text x="438" y="138" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">2</text><text x="458" y="137" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">OM · Operate &amp; Maintain</text><text x="458" y="157" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Keep systems running and patched.</text><rect x="36" y="227" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="239" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="66" cy="253" r="13" fill="#3ddc97"/><text x="66" y="258" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">3</text><text x="86" y="257" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">OV · Oversee &amp; Govern</text><text x="86" y="277" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Policy, risk, and leadership.</text><rect x="408" y="227" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="239" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="438" cy="253" r="13" fill="#3ddc97"/><text x="438" y="258" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">4</text><text x="458" y="257" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">PR · Protect &amp; Defend</text><text x="458" y="277" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Defend networks and data.</text><rect x="36" y="347" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="36" y="359" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="66" cy="373" r="13" fill="#3ddc97"/><text x="66" y="378" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">5</text><text x="86" y="377" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">AN · Analyze</text><text x="86" y="397" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Analyze threats and intel.</text><rect x="408" y="347" width="356" height="108" rx="10" fill="#101722" stroke="#223046" stroke-width="1"/><rect x="408" y="359" width="4" height="84" rx="2" fill="#3ddc97"/><circle cx="438" cy="373" r="13" fill="#3ddc97"/><text x="438" y="378" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">6</text><text x="458" y="377" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4">CO · Collect &amp; Operate</text><text x="458" y="397" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="12.5" fill="#93a4b8">Collect and operate capabilities.</text></svg>