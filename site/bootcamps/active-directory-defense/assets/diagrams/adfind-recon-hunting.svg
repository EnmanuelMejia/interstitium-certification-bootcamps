  <title>Hunting AdFind-style recon: from enumeration to response</title>
  <desc>Attackers enumerate with LDAP queries before they strike; hunters baseline normal AD shape and investigate deviations.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8fb0"/></marker></defs>
  <rect x="0" y="0" width="600" height="400" fill="#0b1220"/>
  <text x="28" y="34" font-family="sans-serif" font-size="19" font-weight="700" fill="#f2f6fc">Hunting AdFind-style recon: from enumeration to response</text>  <text x="28" y="54" font-family="sans-serif" font-size="11" fill="#7f93b3" letter-spacing="2">ACTIVE DIRECTORY DEFENSE</text>  <rect x="170" y="72" width="260" height="48" rx="10" fill="#141d33" stroke="#a855f7" stroke-width="2"/>  <text x="300" y="91" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eef3fa">Enumerate</text>  <text x="300" y="109" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9fb0c8">AdFind / LDAP</text>  <line x1="300" y1="121" x2="300" y2="133" stroke="#7d8fb0" stroke-width="1.8" marker-end="url(#arr)"/>  <rect x="170" y="134" width="260" height="48" rx="10" fill="#141d33" stroke="#a855f7" stroke-width="2"/>  <text x="300" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eef3fa">Baseline</text>  <text x="300" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9fb0c8">normal AD shape</text>  <line x1="300" y1="184" x2="300" y2="196" stroke="#7d8fb0" stroke-width="1.8" marker-end="url(#arr)"/>  <rect x="170" y="197" width="260" height="48" rx="10" fill="#141d33" stroke="#a855f7" stroke-width="2"/>  <text x="300" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eef3fa">Detect</text>  <text x="300" y="235" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9fb0c8">anomalies</text>  <line x1="300" y1="247" x2="300" y2="259" stroke="#7d8fb0" stroke-width="1.8" marker-end="url(#arr)"/>  <rect x="170" y="260" width="260" height="48" rx="10" fill="#141d33" stroke="#a855f7" stroke-width="2"/>  <text x="300" y="279" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eef3fa">Hunt</text>  <text x="300" y="297" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9fb0c8">hypothesis</text>  <line x1="300" y1="310" x2="300" y2="322" stroke="#7d8fb0" stroke-width="1.8" marker-end="url(#arr)"/>  <rect x="170" y="323" width="260" height="48" rx="10" fill="#141d33" stroke="#a855f7" stroke-width="2"/>  <text x="300" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eef3fa">Respond</text>  <text x="300" y="360" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9fb0c8">contain</text></svg>
