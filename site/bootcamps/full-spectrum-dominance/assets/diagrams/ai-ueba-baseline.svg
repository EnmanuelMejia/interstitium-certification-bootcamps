  <title>UEBA: baseline versus deviation</title>
  <desc>A 24-hour timeline from midnight to midnight. A shaded band marks the user's normal login window, 8 AM to 6 PM. Green dots inside the band show normal logins from Boston. One red marker at 2:47 AM shows a login from a foreign location, labeled as a deviation scoring 97 out of 100 because of impossible travel, off-hours access, and 21 times normal data volume.</desc>
  <rect x="0" y="0" width="900" height="340" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a2332">UEBA: baseline versus deviation</text>
  <text x="450" y="50" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">Priya, finance analyst - baselined: 08:00-18:00 ET, Boston, &lt;200 MB/day, peer group of 14 analysts</text>
  <rect x="80" y="110" width="740" height="90" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="306" y="110" width="370" height="90" fill="#dcfce7" opacity="0.55"/>
  <text x="491" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">normal window: 08:00 - 18:00</text>
  <line x1="80" y1="200" x2="820" y2="200" stroke="#475569" stroke-width="2"/>
  <g font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    <text x="80" y="220">00:00</text>
    <text x="203" y="220">06:00</text>
    <text x="326" y="220">12:00</text>
    <text x="449" y="220">18:00</text>
    <text x="572" y="220">24:00</text>
    <text x="695" y="220">06:00</text>
    <text x="818" y="220">12:00</text>
  </g>
  <g>
    <circle cx="330" cy="155" r="7" fill="#16a34a"/>
    <circle cx="380" cy="155" r="7" fill="#16a34a"/>
    <circle cx="430" cy="155" r="7" fill="#16a34a"/>
    <circle cx="500" cy="155" r="7" fill="#16a34a"/>
    <circle cx="560" cy="155" r="7" fill="#16a34a"/>
    <text x="445" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">normal logins: Boston, business hours</text>
  </g>
  <g>
    <circle cx="150" cy="155" r="10" fill="#ef4444"/>
    <line x1="150" y1="165" x2="150" y2="200" stroke="#ef4444" stroke-width="2"/>
    <rect x="170" y="230" width="330" height="78" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="182" y="252" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">ANOMALY - 02:47, foreign IP, 4.2 GB</text>
    <text x="182" y="272" font-family="sans-serif" font-size="12" fill="#7f1d1d">deviation score 97/100: impossible travel +</text>
    <text x="182" y="290" font-family="sans-serif" font-size="12" fill="#7f1d1d">off-hours + 21x baseline volume</text>
  </g>
  <text x="450" y="328" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">UEBA compounds independent deviations - one signal is noise, three is an incident lead.</text>
