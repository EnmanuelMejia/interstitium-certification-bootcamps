<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Symmetric Encryption</title><desc>Plaintext combined with AES-256 key produces Ciphertext</desc><rect width="800" height="450" fill="#0a0e14" rx="12"/><text x="36" y="44" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="23" font-weight="700" fill="#e9f1f4">Symmetric Encryption</text><text x="36" y="68" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="13" fill="#93a4b8">One shared key locks and unlocks the data.</text><rect x="36" y="87" width="728" height="2" fill="#223046" opacity="0.6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a4b8"/></marker></defs><rect x="70" y="167" width="190" height="130" rx="10" fill="#101722" stroke="#3ddc97" stroke-width="2"/><text x="165" y="211" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4" text-anchor="middle">Plaintext</text><text x="165" y="231" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Readable data</text><rect x="305" y="167" width="190" height="130" rx="10" fill="#16202f" stroke="#fbbf24" stroke-width="2"/><text x="400" y="211" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4" text-anchor="middle">AES-256 key</text><text x="400" y="231" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Shared secret, 256-bit</text><rect x="540" y="167" width="190" height="130" rx="10" fill="#101722" stroke="#a78bfa" stroke-width="2"/><text x="635" y="211" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="700" fill="#e9f1f4" text-anchor="middle">Ciphertext</text><text x="635" y="231" font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size="11.5" fill="#93a4b8" text-anchor="middle">Unreadable without key</text><line x1="260" y1="232" x2="305" y2="232" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/><line x1="495" y1="232" x2="540" y2="232" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#ah)"/></svg>